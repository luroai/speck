<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The prototype of speck's watching animation, agreed with the user on 2026-10-25 (0502 to 0505). Open it from this folder:
     it loads the real screen code from templates/lcd.js. ?beat=<name> plays one beat on repeat. -->
<title>speck watching</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap">
<style>
  /* Layout: speck's screen in its dark frame, as the panel's header has it, with a few controls and what speck is doing under it */
  :root {
    --bg: #f3f3f3; --ink: #141414eb; --muted: #141414ba; --line: #14141426; --raise: #fcfcfc;
    --bezel: #262722; --bezel-ink: #e6e7df; --bezel-muted: #b8b9b1;
    --lcd-bg: #e6e9db; --lcd-off: #dde1cf; --lcd-ink: #20241d; --lcd-red: #d63f28; --lcd-shadow: rgba(30, 40, 15, .14);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141414; --ink: #e4e4e4eb; --muted: #e4e4e4b8; --line: #e4e4e426; --raise: #1c1c1c; --bezel: #080907; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #141414; --ink: #e4e4e4eb; --muted: #e4e4e4b8; --line: #e4e4e426; --raise: #1c1c1c; --bezel: #080907; color-scheme: dark }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
  .bezel { padding: 5px 7px 7px; background: var(--bezel); color: var(--bezel-ink); border-radius: 12px; }
  .print { display: flex; align-items: center; gap: 10px; padding: 0 2px 4px; }
  .name { display: inline-flex; align-items: center; gap: .25em; font: 900 32px/1 "Doto", ui-monospace, monospace; }
  .name::before { content: ""; width: .375em; height: .375em; border-radius: 50%; background: var(--lcd-red); }
  .repo { flex: 1; text-align: right; font-size: 12px; color: var(--bezel-muted); }
  .glass { position: relative; border-radius: 4px; overflow: hidden; border: .5px solid var(--bezel-muted); background: var(--lcd-bg); }
  .glass::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 2px 8px #0000004d; pointer-events: none; border-radius: inherit; }
  .glass canvas { display: block; width: 100%; height: auto; aspect-ratio: 160 / 72; image-rendering: pixelated; }
  .now { margin: 0; font: 13px/1.4 var(--mono); color: var(--muted); min-height: 1.4em; }
  .now b { color: var(--ink); font-weight: 500; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .row > span { font-size: 13px; color: var(--muted); min-width: 4.5em; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--raise); }
  .seg button { min-width: 44px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: 600 13px var(--sans); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .seg button:focus-visible { outline: 2px solid #3c7cab; outline-offset: 1px; }
  .beats { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .beats li { display: flex; gap: 8px; }
  .beats li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: .55em; border-radius: 50%; background: var(--line); }
  .beats li.on { color: var(--ink); }
  .beats li.on::before { background: var(--lcd-red); }
  .row select { flex: 1 1 0; width: 0; min-width: 0; }
  select { min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--raise); color: var(--ink); font: 14px var(--sans); max-width: 100%; }
  select:focus-visible { outline: 2px solid #3c7cab; outline-offset: 1px; }
  .beats li { cursor: pointer; }
  .beats li:hover { color: var(--ink); }
  h2 { margin: 6px 0 0; font: 600 13px var(--sans); color: var(--muted); }
</style>

<div class="wrap">
  <div class="bezel">
    <div class="print"><span class="name">speck</span><span class="repo">speck · main</span></div>
    <div class="glass"><canvas id="screen" aria-label="speck's screen, watching the builds"></canvas></div>
  </div>
  <p class="now" id="now"></p>
  <div class="row"><span>Version</span><div class="seg" role="group" aria-label="Version"><button type="button" data-v="new" aria-pressed="true">New</button><button type="button" data-v="old" aria-pressed="false">Today</button></div></div>
  <div class="row"><span>Builds</span><div class="seg" role="group" aria-label="Builds"><button type="button" data-n="1" aria-pressed="true">1</button><button type="button" data-n="2" aria-pressed="false">2</button><button type="button" data-n="3" aria-pressed="false">3</button></div></div>
  <div class="row"><span>Speed</span><div class="seg" role="group" aria-label="Speed"><button type="button" data-s="1" aria-pressed="true">1×</button><button type="button" data-s="3" aria-pressed="false">3×</button></div></div>
  <div class="row"><span>Beat</span><select id="pick" aria-label="Which beat to play"><option value="">Random, as the panel would</option></select></div>
  <h2>What speck does while it watches</h2>
  <ul class="beats" id="beats"></ul>
</div>

<script src="../../../templates/lcd.js"></script>
<script>
(() => {
  const LCD = window.SpeckLCD, { INK, FAINT, OFF, F5 } = LCD;
  const S = { cols: 160, rows: 72, top: 11, floor: 61, line: 63, cap: 65 };
  const opt = { v: 'new', n: 1, s: 1 };
  const clamp01 = x => Math.max(0, Math.min(1, x)), lerp = (a, b, k) => a + (b - a) * k;
  const sine = k => -(Math.cos(Math.PI * clamp01(k)) - 1) / 2;
  const seg = (p, a, b) => clamp01((p - a) / (b - a));
  const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const rim = a => ({ x: 20 * Math.cos(a), y: -24 + 20 * Math.sin(a) });
  const ptl = (a, b, k) => ({ x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) });

  // ---- The scene: speck on the right, a little CRT television for each build on the left ----
  const BX = 14; // speck's place on the floor
  const TVS = { 1: [{ cx: -46, w: 36, h: 25 }], 2: [{ cx: -62, w: 27, h: 20 }, { cx: -32, w: 27, h: 20 }], 3: [{ cx: -70, w: 21, h: 17 }, { cx: -47, w: 21, h: 17 }, { cx: -24, w: 21, h: 17 }] };
  const tvs = () => TVS[opt.n];
  const LEG = 3.5; // the TV stands on two short legs
  // Each TV's parts, in scene units: its box, its screen (left of the knobs) and the tips of its rabbit ears.
  function tvGeom(m, wig = 0) {
    const x0 = m.cx - m.w / 2, y1 = -LEG, y0 = y1 - m.h, knobs = Math.max(6, m.w * .24);
    const sx0 = x0 + 2.5, sx1 = x0 + m.w - knobs, sy0 = y0 + 2.5, sy1 = y1 - 2.5;
    const top = { x: m.cx + 1, y: y0 }, ear = m.h * .55;
    const tipL = { x: top.x - ear * Math.sin(.5 + wig), y: top.y - ear * Math.cos(.5 + wig) };
    const tipR = { x: top.x + ear * Math.sin(.42 - wig * .7), y: top.y - ear * Math.cos(.42 - wig * .7) };
    return { x0, y0, y1, knobs, sx0, sx1, sy0, sy1, top, tipL, tipR };
  }
  // Pong's ball and paddles on a TV's screen at time t.
  const clampY = (y, a, b, h) => Math.max(a, Math.min(b - h, y));
  function pongBall(g, t) {
    const ix0 = g.sx0 + 3.5, ix1 = g.sx1 - 3.5, iy0 = g.sy0 + 2.5, iy1 = g.sy1 - 2.5, W = ix1 - ix0, H = iy1 - iy0;
    const tri = (v, L) => { const q = ((v % (2 * L)) + 2 * L) % (2 * L); return q < L ? q : 2 * L - q; };
    const x = ix0 + tri(t / 60, W), y = iy0 + tri(t / 85, H), ph = Math.max(3, H * .32);
    return { x, y, ly: y - ph / 2 + 1.5 * Math.sin(t / 200), ry: y - ph / 2 - 1.5 * Math.sin(t / 230) };
  }
  // Each build's TV fills a progress bar at its own pace, then shows a tick for a moment as a step finishes.
  const period = j => 10000 + rnd(j + 5) * 8000, DONE = 1100;
  function tvState(j, t) {
    const P = period(j), u = (t + rnd(j + 9) * P) % P;
    return { prog: clamp01(u / (P - DONE)), done: u >= P - DONE, since: u - (P - DONE) };
  }
  function drawTV(pen, m, j, t, fx) {
    const st = fx.force && fx.force.j === j ? fx.force.st : tvState(j, t), g = tvGeom(m, fx.tv === j ? fx.wig : 0);
    // rabbit ears, behind the box
    pen.lw = 1.2; pen.line(g.top.x, g.top.y, g.tipL.x, g.tipL.y); pen.line(g.top.x, g.top.y, g.tipR.x, g.tipR.y);
    pen.disc(g.tipL.x, g.tipL.y, 1, INK); pen.disc(g.tipR.x, g.tipR.y, 1, INK);
    pen.disc(g.top.x, g.top.y, 2.2, INK, 1.4);
    // legs and the box, with rounded corners
    pen.lw = 1.5; pen.line(g.x0 + 4, g.y1, g.x0 + 2.5, 0); pen.line(g.x0 + m.w - 4, g.y1, g.x0 + m.w - 2.5, 0);
    const r = 2.5, box = [[g.x0 + r, g.y0], [g.x0 + m.w - r, g.y0], [g.x0 + m.w, g.y0 + r], [g.x0 + m.w, g.y1 - r], [g.x0 + m.w - r, g.y1], [g.x0 + r, g.y1], [g.x0, g.y1 - r], [g.x0, g.y0 + r]];
    pen.lw = 1.8; pen.fillPoly(box, OFF); pen.poly(box, INK);
    // the knobs and a speaker grille, on the right
    const kx = g.x0 + m.w - g.knobs / 2 - .5, kr = Math.max(1.4, g.knobs * .2);
    pen.lw = 1.2; pen.ring(kx, g.y0 + m.h * .28, kr); pen.ring(kx, g.y0 + m.h * .55, kr);
    for (let i = 0; i < 3; i++) pen.line(kx - kr, g.y1 - 3 - i * 2, kx + kr, g.y1 - 3 - i * 2, FAINT);
    // the curved glass: a rounded screen
    const c = 2, scr = [[g.sx0 + c, g.sy0], [g.sx1 - c, g.sy0], [g.sx1, g.sy0 + c], [g.sx1, g.sy1 - c], [g.sx1 - c, g.sy1], [g.sx0 + c, g.sy1], [g.sx0, g.sy1 - c], [g.sx0, g.sy0 + c]];
    pen.lw = 1.2; pen.poly(scr, INK);
    const ix0 = g.sx0 + 2.5, ix1 = g.sx1 - 2.5, iy0 = g.sy0 + 2.5, iy1 = g.sy1 - 2.5;
    if (fx.static === j) { // snow
      const f = Math.floor(t / 70);
      for (let y = iy0; y <= iy1; y += 1.4) for (let x = ix0; x <= ix1; x += 1.4) { const q = rnd(f * 7.3 + x * 3.1 + y * 17.7); if (q > .55) pen.dotAt(x, y, q > .85 ? INK : FAINT); }
      return;
    }
    if (fx.pong === j) { // Pong: two paddles and a ball
      const b = pongBall(g, t), ph = Math.max(3, (iy1 - iy0) * .32);
      pen.lw = 1.8; pen.line(ix0, clampY(b.ly, iy0, iy1, ph), ix0, clampY(b.ly, iy0, iy1, ph) + ph); pen.line(ix1, clampY(b.ry, iy0, iy1, ph), ix1, clampY(b.ry, iy0, iy1, ph) + ph);
      for (let y = iy0; y < iy1; y += 2) pen.dotAt((ix0 + ix1) / 2, y, FAINT);
      pen.disc(b.x, b.y, 1.4, INK);
      return;
    }
    if (fx.mirror === j && fx.me) { // a tiny speck, copying speck
      const me = fx.me, cx = (ix0 + ix1) / 2 + (me.x - BX) * .25, by = iy1 + 2 + (me.y || 0) * .35, r = (iy1 - iy0) * .4;
      pen.save(); pen.translate(cx, by); pen.rotate(-(me.rot || 0)); pen.lw = 1.1;
      pen.ring(0, -r - 1, r); pen.disc(-r * .62, -r * 1.95, r * .26, INK); pen.disc(r * .62, -r * 1.95, r * .26, INK);
      pen.disc(-(me.lookX || 0) * r * .4, -r - 1 + (me.lookY || 0) * r * .3, Math.max(.8, r * .25), LCD.RED);
      pen.restore();
      return;
    }
    if (st.done) { // a step finished: a tick, drawn in
      const k = clamp01(st.since / 300), cx = (ix0 + ix1) / 2, cy = (iy0 + iy1) / 2, s = Math.min(ix1 - ix0, iy1 - iy0) / 12;
      const A = [cx - 5 * s, cy], B = [cx - 1.5 * s, cy + 3.5 * s], C = [cx + 6 * s, cy - 4.5 * s];
      pen.lw = 1.8;
      if (k > 0) pen.line(A[0], A[1], lerp(A[0], B[0], Math.min(1, k * 2)), lerp(A[1], B[1], Math.min(1, k * 2)));
      if (k > .5) pen.line(B[0], B[1], lerp(B[0], C[0], (k - .5) * 2), lerp(B[1], C[1], (k - .5) * 2));
      return;
    }
    // the build's log scrolling up, its newest line being typed, and its progress bar
    const rows = Math.max(1, Math.floor((iy1 - iy0 - 3) / 2.6)), tt = fx.frozen === j ? fx.frozenAt : t, sc = Math.floor(tt / 420 + j * 13);
    for (let rr = 0; rr < rows; rr++) {
      const n = sc + rr, last = rr === rows - 1, full = 2 + rnd(n + j * 31) * (ix1 - ix0 - 2);
      const len = last ? full * clamp01((tt % 420) / 420 * 1.6) : full, H = iy1 - iy0 - 2;
      const y = fx.roll === j ? iy0 + ((rr * 2.6 + fx.rollOff * H) % H) : iy0 + rr * 2.6;
      if (len > 1) pen.line(ix0, y, ix0 + len, y, last ? INK : FAINT);
    }
    if (fx.roll === j) { const H = iy1 - iy0 - 2, by = iy0 + ((fx.rollOff * H + H * .6) % H); pen.lw = 2.2; pen.line(ix0 - 1, by, ix1 + 1, by, INK); pen.lw = 1.4; }
    pen.lw = 1.4; pen.line(ix0, iy1, ix1, iy1, FAINT);
    if (st.prog > .02) pen.line(ix0, iy1, ix0 + (ix1 - ix0) * st.prog, iy1, INK);
  }

  // ---- What speck does: a beat at a time, picked at random and never the same twice running ----
  const BEATS = {
    scan: { w: 3, d: [5200, 7000], label: 'Keeping an eye on the builds' },
    read: { w: 2, d: [4600, 5400], label: 'Ticking a line off the checklist' },
    lean: { w: 2, d: [3600, 4400], label: 'Leaning in for a closer look' },
    popcorn: { w: 2, d: [5200, 6200], label: 'Popcorn, tossed up and caught' },
    tune: { w: 1, d: [5000, 5800], label: 'Tuning a snowy TV by waggling its own ear' },
    hiccup: { w: 1, d: [4200, 5000], label: 'Hiccups' },
    mirror: { w: 1, d: [5600, 6400], label: 'A tiny speck on the TV copying its every move' },
    bubble: { w: 1, d: [4600, 5400], label: 'Blowing a bubble that pops in its face' },
    spider: { w: 1, d: [5000, 5800], label: 'A spider dropping in to say hello' },
    pong: { w: 1, d: [5600, 6600], label: 'The TV flicks over to Pong' },
    vhold: { w: 1, d: [5000, 5800], label: 'A TV picture rolls, and speck tilts to follow it' },
    peek: { w: 1, d: [5600, 6400], label: 'Too tense to watch: peeking round the clipboard as a step nearly finishes' },
    drumroll: { w: 1, d: [5000, 5800], label: 'A drumroll for a step that’s nearly done, then TA-DA' },
    balance: { w: 1, d: [6000, 6800], label: 'Balancing the clipboard on its head, until it slides off' },
    dance: { w: 1, d: [5400, 6200], label: 'A little dance, until it notices you watching' },
    clock: { w: 1, d: [3600, 4200], label: 'Checking the clock in the corner of its own screen' },
    yoyo: { w: 1, d: [4800, 5600], label: 'Playing with a yo-yo' },
    hum: { w: 1, d: [4200, 5200], label: 'Humming along' },
    mote: { w: 1, d: [5200, 6000], label: 'Following a speck of dust' },
    sneeze: { w: 1, d: [3800, 4400], label: 'A sneeze that shakes its ears' },
    doze: { w: 1, d: [5000, 5800], label: 'Nodding off, until a build wakes it' },
  };
  const KINDS = Object.keys(BEATS);
  const plan = { start: [0], kind: [] };
  let pick = null, lastT = 0; // pick: one beat played over and over, for testing
  function beatAt(t) {
    while (plan.start[plan.start.length - 1] <= t) {
      const i = plan.kind.length, prev = plan.kind[i - 1];
      const live = pick ? [pick] : KINDS.filter(k => BEATS[k].w > 0), tot = live.reduce((s, k) => s + BEATS[k].w, 0);
      let kind = live[0];
      for (let tries = 0; live.length > 1; tries++) {
        let r = rnd(i * 3.7 + 1 + tries * 11) * tot;
        kind = live.find(k => (r -= BEATS[k].w) < 0) || live[0];
        if (kind !== prev) break;
      }
      const [a, b] = BEATS[kind].d;
      plan.kind.push(kind); plan.start.push(plan.start[i] + a + rnd(i + 77) * (b - a));
    }
    let i = plan.kind.length - 1;
    while (plan.start[i] > t) i--;
    const s = plan.start[i], e = plan.start[i + 1];
    return { i, kind: plan.kind[i], k: (t - s) / (e - s), d: e - s, s };
  }
  const readsBefore = i => { let n = 0; for (let j = 0; j < i; j++) if (plan.kind[j] === 'read') n++; return n; };

  // Where speck's eye goes to look at a point in the scene.
  const lookAt = (x, y) => ({ lookX: Math.max(-1, Math.min(1, (x - BX) / 55)), lookY: Math.max(-1, Math.min(1, (y + 26) / 40)) });
  const tvLook = m => lookAt(m.cx, -LEG - m.h / 2);
  const LEFT = rim(Math.PI - .25); // its free shoulder, on the left

  function newWatch(t) {
    const ms = tvs(), b = beatAt(t), k = b.k;
    const env = sine(Math.min(1, k * b.d / 450, (1 - k) * b.d / 450));
    // At rest it watches one build's TV, moving on to the next now and then.
    const focus = ms[Math.floor(t / 3100) % ms.length], rl = tvLook(focus);
    const R = { x: 0, y: 0, rot: 0, sy: 1 + .015 * Math.sin(t / 640), lookX: rl.lookX, lookY: rl.lookY, lid: 1, droop: 0, ear: 0, raise: 0, hide: 0 };
    const O = {}; // this beat's own pose, mixed in by env
    const props = [], fx = { static: -1, frozen: -1, tv: -1, wig: 0, mirror: -1, pong: -1, me: null, roll: -1, rollOff: 0, force: null };
    let clipAt = null; // where the clipboard is when it isn't in its hand
    let eye = null, hand = null, handWorld = null, ticks = readsBefore(b.i) % 5;
    const near = ms[ms.length - 1], nearAt = ms.length - 1; // the TV nearest speck

    if (b.kind === 'scan') { // eye moves from TV to TV, then round the room
      const spots = [...ms.map(tvLook), { lookX: .1, lookY: -.55 }, { lookX: .7, lookY: .05 }];
      const n = spots.length, q = k * n, a = Math.floor(q) % n, c = (a + 1) % n, f = sine(seg(q % 1, .75, 1));
      O.lookX = lerp(spots[a].lookX, spots[c].lookX, f); O.lookY = lerp(spots[a].lookY, spots[c].lookY, f); O.x = O.lookX * 2;
    } else if (b.kind === 'read') { // lifts the clipboard, reads, ticks a line
      O.raise = 1; O.lookX = .8; O.lookY = .55 + .05 * Math.sin(t / 300); O.rot = .03;
      if (k > .68) ticks = (readsBefore(b.i) + 1) % 5;
      if (k > .66 && k < .74) O.y = -1.5 * Math.sin(seg(k, .66, .74) * Math.PI);
    } else if (b.kind === 'lean') { // leans towards a TV, squints, nods
      const m = ms[(b.i + 1) % ms.length], L = tvLook(m);
      O.x = -5; O.rot = -.09; eye = 'focus'; O.lookX = Math.max(-1, L.lookX - .15); O.lookY = L.lookY;
      O.y = -1.6 * Math.abs(Math.sin(seg(k, .5, .8) * Math.PI * 2));
    } else if (b.kind === 'popcorn') { // a bucket in its free hand; now and then a piece goes up and into the gap at its top
      hand = { x: -22, y: -16 };
      O.lookX = rl.lookX; O.lookY = rl.lookY;
      const toss = 1500, n = Math.floor((t - b.s) / toss), u = ((t - b.s) % toss) / toss;
      if (k > .1 && k < .88 && u < .55) { // a kernel in the air
        const a = u / .55, from = { x: -22, y: -18 }, to = { x: -8.3, y: -42 };
        const kx = lerp(from.x, to.x, a), ky = lerp(from.y, to.y, a) - 16 * Math.sin(a * Math.PI);
        O.lookX = .1 + lerp(-.6, -.1, a); O.lookY = lerp(.2, -1, a);
        props.push({ key: 'kernel', draw(pen) { pen.disc(B.x + kx, B.y + ky, 1.3, INK); } });
      } else if (k > .1 && k < .88 && u < .75) { eye = 'bliss'; O.y = -1; }
      props.push({ key: 'bucket', a: env, draw(pen) {

    nowEl.innerHTML = b ? `${pick ? 'Playing on repeat' : 'Now'}: <b>${BEATS[b.kind].label}</b>` : 'Today: glancing about, reading the clipboard, every 7.2 seconds';
    for (const li of list.children) li.classList.toggle('on', !!b && li.dataset.k === b.kind);
  }
  function group(attr, key, cast) {
    document.querySelectorAll(`[data-${attr}]`).forEach(btn => btn.addEventListener('click', () => {
      opt[key] = cast(btn.dataset[attr]);
      document.querySelectorAll(`[data-${attr}]`).forEach(o => o.setAttribute('aria-pressed', String(o === btn)));
      shown = '';
    }));
  }
  group('v', 'v', String); group('n', 'n', Number); group('s', 's', Number);
  // ?beat=<name> plays one beat over and over, for checking it
  const only = new URLSearchParams(location.search).get('beat');
  if (only && BEATS[only]) choose(only);
  new LCD.Screen(document.getElementById('screen'), { cols: S.cols, rows: S.rows, still: false, crisp: [S.line + 1], draw: frame });
})();
</script>
