# speck configuration

base_branch: main
branch_prefix: speck/

builder: claude
reviewer: codex                  # codex | claude-subagent
allow_same_model_review: false   # must be true for builder and reviewer to be the same agent
reviewer_model: gpt-6.1-sol            # blank: the reviewer's own default. Otherwise a model name in the reviewer's own format
reviewer_effort: ""              # blank: the reviewer's own default. Otherwise low | medium | high | xhigh | max

auto_ship: true                  # true: the build ships a ticket as soon as the reviewer approves it, without waiting for /speck-ship
auto_ship_risk: [low, high]      # which ticket risks auto_ship covers: low, high or both

worktrees: true                  # true: each build gets its own git worktree beside your checkout (speck start). false: builds branch in your checkout
worktree_setup: ""               # run in each new worktree, for example: npm ci

# speck run: starts a build for each ready ticket. {id} is the ticket, {session} a fresh UUID for the build's session.
# The default skips every permission prompt, because nobody is there to answer them: the agent can run any command.
build_command: 'claude -p "/speck-build {id}" --session-id {session} --output-format stream-json --verbose --dangerously-skip-permissions'
max_parallel_builds: 4           # how many builds speck run keeps going at once
# The panel shows this, run from the folder speck run started in, to reopen a blocked build's session. {session} is its id.
# Blank: the panel shows only the session id.
resume_command: 'claude --resume {session}'

commands:
  test: "npm test"
  test_files: node --test {files}

limits:
  max_acceptance_criteria: 5
  max_changed_lines: 5000         # excluding tests and lockfiles; the build stops and proposes a split if exceeded
  max_review_rounds: 3
  max_merge_rounds: 2             # review rounds in a row re-checking a merge of the base branch after an approval; they don't count towards max_review_rounds
  escalate_after_repeat_disputes: 2

reviewer_options:
  codex:
    sandbox: read-only
  claude-subagent: {}

github:
  status_check: speck/review
