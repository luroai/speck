<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="speck">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="status-bar">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)">
<title>speck · control panel</title>
<script id="theme-start">
// 0136: set the look before the page is first drawn: the one last chosen with the button in this browser, or else the
// computer's light or dark setting, followed as it changes until a choice is made.
(() => {
  const root = document.documentElement;
  const saved = () => { try { const t = localStorage.getItem('speck-theme'); return t === 'light' || t === 'dark' ? t : null; } catch { return null; } };
  const system = matchMedia('(prefers-color-scheme: dark)');
  // 0160: the home-screen app's status bar: black-translucent (light text) on the dark look, default (dark text) on the
  // light one. iOS reads it as the app opens.
  const bar = look => { const m = document.getElementById?.('status-bar'); if (m) m.content = look === 'dark' ? 'black-translucent' : 'default'; };
  const set = look => { root.dataset.theme = look; bar(look); };
  set(saved() || (system.matches ? 'dark' : 'light'));
  system.addEventListener('change', e => { if (!saved()) set(e.matches ? 'dark' : 'light'); });
  globalThis.setLook = set; // for the light/dark button
})();
</script>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --raise: #f0eee6; --line: #87847d; --line-soft: #e8e7e3;
    --text: #141413; --muted: #3d3d3a; --faint: #4d4c48;
    --accent: #853123; --ok: #3f522e; --warn: #67460b; --bad: #921f2d; --run: #304f6d; --idea: #623f6c;
    --inbox: #22544c; /* the inbox's own colour */
    --bug: #7a3553; /* the bug tag's own colour */
    --fix: #584c0e; /* the fix tag's own colour */
  }
  /* The zen look: a serif for headings and ticket titles, a light sans for body text and a monospace for labels. Each
     names the zen fonts first, used when they're installed, and none is loaded from another host. */
  * { box-sizing: border-box; border-radius: 0 !important; }
  /* 0160: in the home-screen app the page reaches behind the status bar and home indicator (viewport-fit=cover). The
     header pads the status bar, the page pads the home indicator and a phone's rounded corners on its sides, and the full
     ticket starts below the status bar, so nothing it scrolls shows there. While the
     header stays on screen, a ticket scrolled to sits below it (--head is its height, kept by the page script). */
  html { scroll-padding-top: var(--head, 0px); }
  body { padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  body { margin: 0; font: 400 13px/1.5 "Zen Kaku Gothic New", "Noto Sans JP", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  b, strong { font-weight: 600; }
  /* 0161: a clear ring round whatever the keyboard reaches */
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  code, .mono, .id { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  code { font-size: 12px; color: var(--muted); }

  header { position: sticky; top: 0; z-index: 8; overflow-anchor: none; display: flex; align-items: center; gap: 16px; padding: calc(14px + env(safe-area-inset-top)) 24px 14px; border-bottom: .5px solid var(--line); background: var(--bg); }
  .logo { font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-weight: 600; font-size: 18px; }
  /* 0170: speck's eared logo from the landing page, before the wordmark, in the text colour with the red dot */
  .logo .mark { width: 1em; height: 1em; vertical-align: -.16em; margin-right: 6px; }
  .logo .mark .dot { fill: #b0412e; }
  :root[data-theme="dark"] .logo .mark .dot { fill: #d4664e; }
  .logo span { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--faint); font-weight: 400; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; margin-left: 6px; }
  .repo { color: var(--muted); font-size: 12px; margin-left: auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo, .run-state, .theme { flex-shrink: 0; }
  .theme { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: .5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .theme:hover { border-color: var(--text); color: var(--text); }
  .theme svg { width: 15px; height: 15px; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }
  .live { display: inline-block; width: 6px; height: 6px; background: var(--run); margin-right: 6px; vertical-align: 1px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 20px 24px calc(20px + env(safe-area-inset-bottom)); }
  section { background: var(--panel); border: .5px solid var(--line); }
  section.full { grid-column: 1 / -1; }
  .sh { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: .5px solid var(--line); }
  .sh h2 { margin: 0; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .sh .n { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); font-size: 12px; }
  .sh .hint { margin-left: auto; font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--faint); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
  .group { padding: 7px 14px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); border-bottom: .5px solid var(--line-soft); background: var(--raise); }
  .group.attn { color: var(--warn); }
  .group.run { color: var(--run); }

  .id { font-size: 12px; color: var(--muted); }
  .tag { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; padding: 0 8px; border: .5px solid var(--line); color: var(--muted); white-space: nowrap; line-height: 27px; display: inline-block; }
  .tag.p1 { color: var(--text); border-color: var(--text); }
  .tag.high { color: var(--bad); border-color: var(--bad); }
  .tag.bug { color: var(--bug); border-color: var(--bug); }
  .tag.fix { color: var(--fix); border-color: var(--fix); }
  .prio { position: relative; display: inline-block; }
  .tag.pick { cursor: pointer; }
  .tag.pick:hover { color: var(--text); border-color: var(--muted); }
  .prio-menu { position: absolute; top: calc(100% + 2px); left: 0; z-index: 5; display: flex; background: var(--panel); border: .5px solid var(--line); }
  .prio-menu button { font: inherit; font-size: 14px; padding: 1px 8px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
  .prio-menu button:hover { color: var(--text); }
  .prio-menu button.on { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .item .prio-refused { margin-top: 6px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 14px; color: var(--text); }
  .sub { font-size: 12px; color: var(--muted); }
  .tick { display: inline-block; width: 4px; height: 8px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin: 0 6px 2px 2px; }
  .sq { display: inline-block; width: 6px; height: 6px; background: currentColor; margin: 0 6px 1px 1px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .run { color: var(--run); }

  /* Shaping */
  /* 0151: each item is a card of its own, with space between cards */
  #shaping { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  #shaping .empty { padding: 0 4px; }
  .item { padding: 10px 14px; border: 1px solid var(--line); }
  .head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; cursor: pointer; }
  .item .head { margin: -10px -14px; padding: 10px 14px; } /* the item's padding opens and closes it too */
  .item .checks { grid-column: 1 / 2; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .item.open { background: var(--raise); border-color: var(--text); }
  .detail { margin-top: 10px; border-top: .5px solid var(--line-soft); padding-top: 8px; display: grid; grid-template-columns: 1fr 220px; gap: 16px; }
  .detail h4 { margin: 0 0 4px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 400; }
  .detail p { margin: 0 0 8px; color: var(--text); }
  .detail ol { margin: 0; padding-left: 18px; color: var(--text); }
  .detail ol li { margin-bottom: 4px; }
  .ready { border-left: .5px solid var(--line-soft); padding-left: 14px; font-size: 12px; }
  .ready div { padding: 3px 0; }
  .set-ready { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-top: 10px; padding: 4px 12px; background: var(--text); color: var(--panel); border: .5px solid var(--text); cursor: pointer; }
  .set-ready:disabled { background: transparent; color: var(--faint); border-color: var(--line); cursor: not-allowed; }
  .ready div.refused { white-space: pre-wrap; }
  /* 0151: a ticket's id and title on one line, a wrapped title's next line starting under the title, then its tags */
  .item.ticket .head { column-gap: 0; } /* its right-hand column is empty: the title gets the whole width */
  .item.ticket .line { display: flex; align-items: baseline; gap: 8px; }
  .item.ticket .line .id { flex: none; font-size: 14px; }
  .item.ticket .line .title { flex: 1 1 auto; min-width: 0; font-size: 17px; }
  .item.ticket .tag-row { grid-column: 1 / 2; }
  .item.ticket .prio { display: inline-flex; }

  /* Queue */
  /* 0155: each ticket is a card of its own, laid out as a Plan ticket. 0167: only a ticket waiting for you or in trouble
     is coloured, by its border and background (below the highlights, so they win) */
  #queue { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  #queue .empty { padding: 0 4px; }
  .q { padding: 10px 14px; border: 1px solid var(--line); }
  .q .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 0; align-items: baseline; cursor: pointer; }
  .q .top .line { grid-area: 1 / 1; display: flex; align-items: baseline; gap: 8px; }
  .q .top .line .id { flex: none; font-size: 14px; }
  .q .top .line .title { flex: 1 1 auto; min-width: 0; font-size: 17px; }
  .q .top .sub { grid-area: 1 / 2; }
  .q .top .sub:not(:empty) { margin-left: 12px; }
  .q .top .tag-row { grid-area: 2 / 1 / 3 / 3; }
  .q .log { margin: 6px 0 4px; padding: 6px 10px; height: 24em; max-height: 24em; overflow-y: auto; background: var(--bg); border-left: 2px solid var(--line-soft);
    font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
  .q.wait { background: var(--raise); } /* 0161: set back by its fill, not faded, so its text keeps its contrast */
  /* An open running or paused build's Stop build button, beside Full ticket, and why the server refused it */
  .q .stop-build { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 2px 8px; padding: 1px 10px; background: transparent; color: var(--muted); border: .5px solid var(--line); cursor: pointer; }
  .q .stop-build:hover { color: var(--bad); border-color: var(--bad); }
  .q .stop-build:disabled { cursor: default; opacity: .6; }
  /* An open ready ticket's Back to Plan button, beside Full ticket, and why the server refused it */
  .q .back-to-plan { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 2px 8px; padding: 1px 10px; background: transparent; color: var(--muted); border: .5px solid var(--line); cursor: pointer; }
  .q .back-to-plan:hover { color: var(--text); border-color: var(--text); }
  .q .back-to-plan:disabled { cursor: default; opacity: .6; }
  .q .stop-refused, .q .plan-refused { margin: 4px 0 0; font-size: 12px; color: var(--bad); white-space: pre-wrap; }
  .question { margin: 6px 0 4px; padding: 6px 10px; border-left: 2px solid var(--bad); background: var(--bad-bg); color: var(--text); }
  .act { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .act b { color: var(--text); font-weight: 400; }
  .act.to-ship { color: var(--idea); }
  /* 0168: an in-flight ticket's progress, under its title and tags, which keep the card's full width: the builder badge,
     then a sentence saying what's happening and the current stage's name, with the timer at the right of that row. The
     badge is drawn on a canvas from the colour tokens (badgeColours). */
  .q .top:has(> .badgerow) .line { grid-area: 1 / 1 / 2 / 3; }
  .q .top .badgerow { grid-area: 3 / 1; display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: 12px; align-items: center; margin-top: 8px; }
  .q .top:has(> .badgerow) .sub { grid-area: 3 / 2; align-self: center; }
  .q .top .badge { display: block; width: 56px; height: 56px; }
  .q .top .badgetext { display: grid; gap: 2px; min-width: 0; }
  .q .top .say { font-size: 13px; color: var(--text); }
  .q .top + .act { margin-top: 6px; } /* a ready ticket's Queued line, with no bar above it now */
  .q .top .say.bad { color: var(--bad); }
  .q .top .say.to-ship { color: var(--idea); }
  .q .top .stage { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--run); }
  .q .top .stage.bad { color: var(--bad); }
  .q .top .stage.to-ship { color: var(--idea); }
  @media (prefers-reduced-motion: no-preference) {
    /* 0154: a ticket gone to from a linked id lights up, then fades back by itself */
    .item.flash, .q.flash { animation: flash 1.5s ease-out; }
    @keyframes flash { 0%, 40% { box-shadow: inset 0 0 0 2px var(--text); } } /* 0167: a ring only, so a state's tint stays */
    /* 0160: on a phone the header fades in as it slims to one row and as it goes back to two */
    header.slim > * { animation: head-slim .15s ease-out; }
    header.wide > * { animation: head-wide .15s ease-out; }
    @keyframes head-slim { from { opacity: 0; } }
    @keyframes head-wide { from { opacity: 0; } }
  }
  .question.exit.to-ship { border-left-color: var(--idea); }
  .question.exit { border-left-color: var(--bad); max-height: 16em; overflow-y: auto; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  .resume { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; }
  .resume .cmd { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); background: var(--raise); padding: 3px 8px; user-select: all; overflow-wrap: anywhere; }
  .resume .copy { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: none; border: .5px solid var(--line); padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  .resume .copy:hover { color: var(--text); }
  .q .tag.high { color: var(--bad); border-color: var(--bad); }
  .next { color: var(--ok); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; border: .5px solid var(--ok); padding: 0 5px; }

  /* Shipped */
  /* 0157: the stats a grid of tiles of equal size, each number over its label and the tickets its median covers, and
     each shipped ticket a card of its own, laid out as a Plan ticket */
  .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: .5px; background: var(--line); border-bottom: .5px solid var(--line-soft); }
  .stat { display: flex; flex-direction: column; min-width: 0; padding: 8px 12px; background: var(--panel); }
  .stat .num { font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.3; }
  .stat .label { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .stat .count { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--faint); }
  .stats[hidden] { display: none; }
  section.shipped table { display: block; }
  #shipped { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  #shipped .empty { padding: 0 4px; }
  #shipped tr { display: block; padding: 10px 14px; border: 1px solid var(--line); }
  #shipped td { display: block; padding: 0; border: 0; }
  #shipped .line { display: flex; align-items: baseline; gap: 8px; }
  #shipped .line .id { flex: none; font-size: 14px; }
  #shipped .line .title-link { flex: 1 1 auto; min-width: 0; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 17px; overflow-wrap: anywhere; }
  #shipped .tag-row { margin-top: 4px; }
  #shipped .when { margin-top: 4px; color: var(--muted); }
  #shipped .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 16px; margin-top: 8px; }
  #shipped .fig .k { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #shipped .fig .v { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  #shipped .full-cell { margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 14px; border-bottom: .5px solid var(--line-soft); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { color: var(--muted); text-align: right; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; white-space: nowrap; }

  /* Live panel additions */
  .live.go { background: var(--ok); }
  .live.stop { background: var(--bad); }
  /* 0150: Auto-build is one button, the same height as the light/dark one beside it */
  .run-state { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; white-space: nowrap; color: var(--muted); background: var(--panel); border: .5px solid var(--line); cursor: pointer; }
  .run-state:hover { color: var(--text); border-color: var(--text); }
  .run-state:disabled { cursor: default; opacity: .6; }
  .run-state[hidden] { display: none; }
  .run-error { font-size: 12px; color: var(--bad); padding: 6px 24px; border-bottom: .5px solid var(--line); background: var(--bad-bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .run-error[hidden] { display: none; }
  .offline { font-size: 12px; color: var(--bad); padding: 6px 24px; border-bottom: .5px solid var(--line); background: var(--bad-bg); }
  .offline[hidden] { display: none; }
  .restart { font-size: 12px; color: var(--warn); padding: 6px 24px; border-bottom: .5px solid var(--line); background: var(--raise); }
  .restart[hidden] { display: none; }
  .question, .title { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ready div { overflow-wrap: anywhere; }

  /* Shaping: tickets, ideas and the inbox, one list at a time. The selected tab has a border in the text colour (0167). */
  .toggles { display: flex; }
  .toggle { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; padding: 1px 10px; background: transparent; border: .5px solid var(--line); margin-left: -.5px; color: var(--muted); cursor: pointer; }
  .toggle.on { color: var(--text); border-color: var(--text); position: relative; z-index: 1; }
  .item:hover { background: var(--raise); }
  /* The light tints. 0167: the open item in Shaping or the queue is set apart by a raised fill and a border in the text
     colour; only a ticket waiting for you or in trouble keeps a tint (below). */
  :root { --accent-bg: #f7ebe6; --idea-bg: #f2ecf3; --inbox-bg: #e9f2f0; --bad-bg: #fae6e8; }
  .q.open { background: var(--raise); border-color: var(--text); }
  .note { margin: 0; color: var(--text); }
  .empty { padding: 10px 14px; color: var(--faint); font-size: 12px; }
  .path { overflow-wrap: anywhere; }

  /* Chains through after:: a chain icon on a ticket that unlocks others, a padlock on one that waits */
  .chain, .lock { display: inline-block; position: relative; width: 12px; height: 10px; vertical-align: -1px; cursor: help; }
  .chain { color: var(--muted); transform: rotate(-35deg); }
  .chain::before, .chain::after { content: ''; position: absolute; top: 3px; width: 6px; height: 4px; border: 1.5px solid currentColor; }
  .chain::before { left: 0; } .chain::after { left: 4px; }
  .lock { color: var(--faint); }
  .lock::before { content: ''; position: absolute; left: 3px; top: 0; width: 6px; height: 5px; border: 1.5px solid currentColor; border-bottom: 0; }
  .lock::after { content: ''; position: absolute; left: 2px; top: 4px; width: 8px; height: 6px; background: currentColor; }
  .item.hl, .q.hl { border-color: var(--text); }
  .item.dim, .q.dim { background: var(--raise); } /* 0161: set back by its fill, not faded */
  /* 0167: a ticket in trouble, blocked or its build stopped, is crimson; one waiting for you to ship it is purple, as
     nothing is wrong (0138). Each keeps its border and background whether it's open, highlighted or set back. */
  .q.blocked { border-color: var(--bad); background: var(--bad-bg); }
  .q.to-ship { border-color: var(--idea); background: var(--idea-bg); }
  /* 0154: a linked ticket's id in a "waiting on" or "unlocks" note, which goes to that ticket and lights it briefly */
  .goto { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .goto:hover { text-decoration-style: solid; }

<script>
'use strict';

// ---- model: pure, no DOM. test/panel.test.mjs runs this section on its own. ----
const IN_FLIGHT = ['building', 'reviewing', 'blocked', 'approved'];
// A ticket's five-step bar: each step is done, the current one ('now') or neither. A ready ticket has neither on every step.
function progress(t) {
  const rounds = Array.isArray(t.rounds) ? t.rounds : [];
  const last = rounds[rounds.length - 1];
  const latest = last && Number.isFinite(Number(last.round)) && last.round !== null && last.round !== '' ? Number(last.round) : rounds.length;
  const selfCheck = typeof t.self_check === 'string' && t.self_check.trim() !== '';
  const approved = t.status === 'approved';
  const done = [selfCheck || rounds.length > 0, rounds.length > 0 || (selfCheck && t.status === 'reviewing'), approved, approved, false];
  const labels = ['Build', 'Self-check', rounds.length ? `Review ${latest}` : 'Review', 'Approve', 'Ship'];
  const current = t.status === 'ready' ? -1 : approved ? 4 : done.indexOf(false); // approved: Ship is current
  return labels.map((label, i) => ({ label, state: t.status === 'ready' ? '' : done[i] ? 'done' : i === current ? 'now' : '' }));
}
// 0156: what an in-flight queue ticket is doing, as its card says it: a plain sentence, the card's state colour for it
// ('bad', 'to-ship' or '' for the normal text colour), and whether an agent is at work on it, which puts its builder
// badge to work (0168).
// `shipping` is true while a ship of it is running, whoever started it.
// An approved ticket that isn't shipping waits for you, in purple, whether or not its build has exited yet. One that is
// shipping is at work, in the normal text colour.
function doing(t, shipping) {
  if (shipping) return { sentence: 'Shipping', tone: '', moving: true };
  const approved = t.status === 'approved' || t.status === 'done';
  const tone = t.red ? 'bad' : t.to_ship || approved ? 'to-ship' : '';
  const at = sentence => ({ sentence, tone, moving: false });
  if (t.status === 'blocked') return at('Blocked · it has a question for you');
  if (t.red && (t.status === 'building' || t.status === 'reviewing')) return at('The build stopped');
  if (t.paused) return at('Paused');
  if (approved) return at('Approved · waiting for you to ship it');
  const steps = Array.isArray(t.steps) ? t.steps : [], now = steps.findIndex(s => s.state === 'now');
  let sentence = now === 1 ? 'Checking its own work' : 'Writing tests and code';
  if (t.status === 'reviewing') {
    const who = typeof t.reviewer === 'string' && t.reviewer.trim() ? t.reviewer.trim() : 'the reviewer';
    const n = (steps[2] && /(\d+)$/.exec(steps[2].label)) || [null, '1'];
    sentence = `${who[0].toUpperCase()}${who.slice(1)} is reviewing · round ${n[1]}`;
  }
  return { sentence, tone, moving: t.status === 'building' || t.status === 'reviewing' };
}
// 0168: what an in-flight ticket's builder badge shows, from what it's doing (`d`, from doing): its pose and the badge's
// accessible name. While an agent is at work: checking a cloud of code during self-check, going through one with the
// reviewer during review (0169), otherwise at the laptop. With a "?" when it's blocked or stopped (the card's crimson);
// with a flag while it waits for your decision (the card's purple); otherwise still, facing front.
function badgeOf(t, d) {
  if (d.moving) {
    const steps = Array.isArray(t.steps) ? t.steps : [], now = steps.findIndex(s => s.state === 'now');
    if (d.sentence === 'Shipping') return { pose: 'type', label: 'The builder is shipping' };
    if (t.status === 'reviewing') return { pose: 'review', label: 'The builder is with the reviewer' };
    if (now === 1) return { pose: 'check', label: 'The builder is checking its own work' };
    return { pose: 'type', label: 'The builder is writing code' };
  }
  if (d.tone === 'bad') return { pose: 'bad', label: 'The builder needs you' };
  if (t.to_ship) return { pose: 'wait', label: 'The builder is waiting for you' };
  return { pose: 'still', label: t.paused ? 'The builder is paused' : 'The builder is waiting' };
}
// An amount in US dollars, to the cent.
const dollars = n => `$${n.toFixed(2)}`;
// The middle value, or the mean of the two middle ones; null with no values.
function median(values) {
  const v = [...values].sort((a, b) => a - b), mid = Math.floor(v.length / 2);

}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
// When a ticket shipped, in the browser's time zone: HH:MM today, otherwise D Mon, HH:MM (0157), or a dash with no time.
function shippedAt(ms, now) {
  if (ms === null) return '–';
  const d = new Date(ms), pad = n => String(n).padStart(2, '0'), hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return sameDay(d, new Date(now)) ? hm : `${d.getDate()} ${MONTHS[d.getMonth()]}, ${hm}`;
}
// Links through after: among the tickets that aren't done or cancelled. For each id: the ones that list it in after:
// (unlocks, in JSON order, each once) and every ticket linked to it in either direction, through others too (linked).
function chains(tickets) {
  const open = tickets.filter(t => t.status !== 'done' && t.status !== 'cancelled');
  const ids = new Set(open.map(t => String(t.id)));
  const unlocks = new Map(), next = new Map();
  const add = (map, k, v) => { if (!map.has(k)) map.set(k, []); if (!map.get(k).includes(v)) map.get(k).push(v); };
  for (const t of open) {
    const id = String(t.id);
    add(next, id, id);
    for (const a of Array.isArray(t.after) ? t.after.map(String) : []) {
      if (a === id) continue;
      add(unlocks, a, id);
      if (ids.has(a)) { add(next, id, a); add(next, a, id); }
    }
  }
  const linked = new Map();
  for (const id of ids) {
    if (linked.has(id)) continue;
    const group = [id];
    for (let i = 0; i < group.length; i++) for (const n of next.get(group[i]) || []) if (!group.includes(n)) group.push(n);
    for (const n of group) linked.set(n, group);
  }
  return { unlocks: id => unlocks.get(String(id)) || [], linked: id => linked.get(String(id)) || [String(id)] };
}
// A word for a POSIX shell: as it is when it's only letters, digits, /, ., _ and -, otherwise in single quotes.
const shellWord = w => (/^[A-Za-z0-9\/._-]+$/.test(w) ? w : `'${w.replace(/'/g, "'\\''")}'`);

function resumeOf(t, resumeCommand, stopped) {
  const s = t.session;

function fill(id, nodes, emptyText) {
  const box = $(id), want = nodes.length ? nodes : [el('div', 'empty', emptyText)];
  for (const c of [...box.children]) if (!want.includes(c)) box.removeChild(c);
  want.forEach((n, i) => { if (box.children[i] !== n) box.insertBefore(n, box.children[i] || null); });
}
// The items built by the last render, for each box, by key ('t:<id>' or 'i:<path>' in Shaping, the id elsewhere), each
// with everything it shows. An item whose own data and view state are unchanged keeps its node, so text selected in it,
// and a box's scroll position, survive the refresh. What it shows from other items or the clock (`derived`) is put
// right with `update`, on the node it keeps.
const built = new Map();

const signature = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(f => [f, x[f]])) : x));

  const before = built.get(box) || new Map(), now = new Map();
  const nodes = list.map(x => {
    const key = keyOf(x), sig = signature([own(x), viewOf(x)]), from = signature(derived(x)), last = before.get(key);
    if (now.has(key)) return make(x); // a repeated id or path: built afresh each time, as it can't share a node
    const kept = last && last.sig === sig, node = kept ? last.node : make(x);
    if (kept && last.from !== from) update(node, x);
    now.set(key, { sig, from, node });
    return node;
  });
  built.set(box, now);
  return nodes;
}

let state = null;
function render() {
  if (!state) return;
  const m = panelModel(state);
  // A menu whose ticket isn't showing any more is closed, so it can't catch the next click.
  if (priorityMenu !== null && (shapingView !== 'tickets' || !m.drafts.some(t => String(t.id) === priorityMenu))) priorityMenu = null;
  shapingToggle(m);
  onPage = new Set([...(shapingView === 'tickets' ? m.drafts : []), ...m.queue].map(t => String(t.id)));
  // A refused stop's reason goes once its ticket has no Stop build button, so a later build of it doesn't show it.
  for (const id of stopRefused.keys()) if (!m.queue.some(t => String(t.id) === id && t.pausable)) stopRefused.delete(id);
  // The same for a refused Back to Plan once its ticket isn't ready in the queue.
  for (const id of planRefused.keys()) if (!m.queue.some(t => String(t.id) === id && !t.inFlight)) planRefused.delete(id);
  if (shapingView === 'inbox') fill('shaping', keptItems('shaping', m.inbox, i => `n:${i.path}`, i => openInbox.has(i.path), inboxItem), 'Inbox is empty.');
  else if (shapingView === 'ideas') fill('shaping', keptItems('shaping', m.ideas, i => `i:${i.path}`, i => openIdeas.has(i.path), ideaItem), 'No ideas waiting.');
  else fill('shaping', keptItems('shaping', m.drafts, t => `t:${t.id}`,
    t => [open.has(t.id), settingReady.has(t.id), refused.get(t.id) ?? null, priorityMenu === String(t.id), priorityRefused.get(String(t.id)) ?? null], ticketItem,
    { own: ownData, derived: t => [t.chain, t.unlocks, shownLinks(t)], update: newHead }), 'No draft tickets.');
  renderFull(m);

  // The counter comes from the clock, not the ticket, so it is put right on a kept row.
  // A log box is kept through the refresh while its ticket is unchanged, and each new log is put in it in place (showLog).
  const rows = keptItems('queue', m.queue, t => String(t.id), t => [openQueue.has(String(t.id)), shippingId === String(t.id), stopping.has(String(t.id)), stopRefused.get(String(t.id)) ?? null,
    unreadying.has(String(t.id)), planRefused.get(String(t.id)) ?? null], queueItem,
    { own: t => { const { counter, ship_counter, ...own } = ownData(t); return own; }, derived: t => [t.counter, t.ship_counter, t.chain, t.unlocks, shownLinks(t)], update: queueUpdate });
  fill('queue', rows, 'Nothing in flight or ready.');
  startCounters(m.queue.flatMap((t, i) => [...(t.counter !== null && t.held_at === null ? [[child(child(rows[i], 'top'), 'sub'), t.since, !!t.paused]] : []),
    ...(t.ship_counter !== null ? [[shipTime(rows[i]), t.ship_since, false]] : [])]));
  for (const [box, top] of logScroll) box.scrollTop = top === null ? box.scrollHeight : top;
  logScroll.clear();
  queueIds = new Set(m.queue.map(t => String(t.id)));
  linked = new Map([...m.drafts, ...m.queue].map(t => [String(t.id), t.linked]));
  lightUp();
  flash();
  const flying = m.queue.filter(t => t.inFlight).length;
  $('queue-n').textContent = `${flying} in flight · ${m.queue.length - flying} queued`;

  // 0157: each shipped ticket is a card: its id and title (and a bug or fix tag), when it shipped, its figures as label
  // and value pairs, leaving out any it doesn't have, then Review pack. The shipped time turns from the time alone to
  // date and time after midnight, so it is put right on a kept card.
  fill('shipped', keptItems('shipped', m.shipped, t => String(t.id), () => null, t => {
    const fig = (label, value) => el('div', 'fig', null, el('span', 'k', label), typeof value === 'string' ? el('span', 'v', value) : value);
    const figs = [t.minutes !== null ? fig('Time', `${t.minutes} min`) : null, t.roundCount > 0 ? fig('Review rounds', String(t.roundCount)) : null,
      t.tokens > 0 ? fig('Reviewer tokens', tokenCount(t.tokens)) : null, t.builderTokens !== null ? fig('Builder tokens', tokenCount(t.builderTokens)) : null,
      t.builderCost !== null ? fig('Builder cost', dollars(t.builderCost)) : null].filter(Boolean);
    const tag = typeTag(t);
    const name = el('td', 'name', null, el('div', 'line', null, el('span', 'id', t.id), fullLink(t)), tag && el('div', 'row tag-row', null, tag));
    return el('tr', null, null, name, t.end !== null ? el('td', 'when', `Shipped ${t.when}`) : null, figs.length ? el('td', 'figs', null, ...figs) : null,
      el('td', 'full-cell', null, packButton(t)));
  }, { own: t => { const { when, ...own } = t; return own; }, derived: t => t.when, update: (tr, t) => { const w = child(tr, 'when'); if (w) setText(w, `Shipped ${t.when}`); } }), 'Nothing shipped yet.');
  const stat = (value, label, s) => el('div', 'stat', null, el('b', 'num', value), el('span', 'label', label),
    s ? el('span', 'count', plural(s.count, 'ticket')) : null);
  const med = (s, fmt = String) => (s.median === null ? '–' : fmt(s.median));
  $('shipped-stats').hidden = m.shippedTotal === 0;
  $('shipped-stats').replaceChildren(...(m.shippedTotal ? [stat(m.stats.today, 'shipped today'),
    stat(med(m.stats.minutes), 'median minutes', m.stats.minutes), stat(med(m.stats.rounds), 'median review rounds', m.stats.rounds),
    stat(med(m.stats.tokens, n => n.toLocaleString('en-GB')), 'median reviewer tokens', m.stats.tokens),
    stat(med(m.stats.builderTokens, n => n.toLocaleString('en-GB')), 'median builder tokens', m.stats.builderTokens),
    stat(med(m.stats.builderCost, dollars), 'median builder cost', m.stats.builderCost)] : []));
  $('shipped-n').textContent = `${m.shippedTotal} in total`;

  // Whether speck run is on, shown as Auto-build (0144): when it's off, setting a ticket ready starts nothing. The
  // indicator is itself the switch (0150). The button stays put and only its contents change, so it keeps focus.
  const on = !!(state.run && state.run.on);
  const run = $('run');
  run.hidden = false;
  run.className = on ? 'run-state run-on' : 'run-state run-off';
  run.replaceChildren(el('span', on ? 'live go' : 'live stop'),
    document.createTextNode(runSwitching ? (runSwitching === 'on' ? 'Starting…' : 'Pausing…') : on ? 'Auto-build on' : 'Auto-build off'));
  run.setAttribute('aria-pressed', String(on));
  run.disabled = !!runSwitching;
  run.title = on ? 'Pause Auto-build: ready tickets wait' : 'Start Auto-build: build ready tickets one at a time';
}
$('run').addEventListener('click', e => {
  e.stopPropagation();
  if (state && !$('run').disabled) switchRun(state.run && state.run.on ? 'off' : 'on');
});
// 0128: the speck run switch. The server starts or stops speck run and answers once it's on or off, so the button shows
// that at once. A refusal shows speck run's own message under the header until the next click on the switch.
async function switchRun(to) {
  if (runSwitching) return;
  runSwitching = to;
  showRunError(null);
  render();
  try {
    const res = await fetch(`/api/run/${to}`, { method: 'POST', headers: { 'X-Speck-Token': TOKEN } });
    let body = null;
    try { body = await res.json(); } catch { /* no JSON: say what we know */ }
    if (res.ok && body && body.run) {
      if (body.run.on) state.run = body.run;
      else delete state.run;
    } else showRunError(body && typeof body.error === 'string' && body.error ? body.error : `The server refused (${res.status}).`);
  } catch {
    showRunError(`Couldn't reach the panel server, so speck run wasn't turned ${to}.`);
  }
  runSwitching = null;

}
function showRunError(text) {
  $('run-error').hidden = !text;
  $('run-error').textContent = text || '';
}
function setConnected(ok, problem) {
  $('offline').hidden = ok;
  if (!ok) $('offline').textContent = problem
    ? `speck panel couldn't read the tickets: ${problem} Showing the last state received. Retrying every 2 seconds…`
    : "Disconnected: can't reach speck panel. Showing the last state received. Retrying every 2 seconds…";
  if (state) render();
}

// speck panel restarts by itself when its code changes. When the new code fails to start, the old server keeps serving
// and says so in restart_error, until a later change starts.
function showRestartError(line) {
  $('restart').hidden = !line;
  $('restart').textContent = line ? `speck panel couldn't restart with its changed code: ${line} It's still running the code it had, and tries again on the next change.` : '';
}

// Fetches the state every 2 seconds without reloading the page. Each poll schedules the next one before it starts, so
// a request that never finishes can't stop polling. A request still pending when the next one is due counts as
// disconnected and is aborted, and only the latest request's answer is used. A failure shows as disconnected and
// polling carries on, so the page recovers by itself when the server is back.
let seq = 0, pending = null;
async function poll() {
  setTimeout(poll, POLL_MS);
  if (pending) { pending.abort(); pending = null; setConnected(false); }
  const mine = ++seq, ctl = new AbortController();
  pending = ctl;
  try {
    const res = await fetch('/api/state', { cache: 'no-store', signal: ctl.signal });
    let body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (mine !== seq) return; // a newer request has taken over
    if (!res.ok || !body || !Array.isArray(body.tickets)) setConnected(false, (body && body.error) || `the server answered ${res.status}.`);
    else { state = body; showRestartError(body.restart_error); setConnected(true); }
  } catch (e) {
    if (mine === seq) setConnected(false);
  } finally {
    if (pending === ctl) pending = null;
  }
}
poll();
