<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>speck · control panel</title>
<style>
  :root {
    --bg: #1c1d20; --panel: #232428; --raise: #2a2b30; --line: #36383e; --line-soft: #2e3035;
    --text: #d6d8dd; --muted: #8a8e97; --faint: #5f636c;
    --accent: #7aa7f0; --ok: #62b77a; --warn: #e3a04f; --bad: #e0675d; --run: #5fa8e0; --idea: #b291e6;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  body { margin: 0; font: 13px/1.5 "Liberation Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  code, .mono, .id { font-family: "Liberation Mono", monospace; }
  code { font-size: 12px; color: #c9cdd6; }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .logo { font-weight: 700; font-size: 16px; }
  .logo span { color: var(--muted); font-weight: 400; }
  .repo { color: var(--muted); font-size: 12px; }
  .pills { margin-left: auto; display: flex; gap: 0; }
  .pill { font-size: 12px; padding: 4px 12px; border: 1px solid var(--line); margin-left: -1px; color: var(--muted); }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.attn { color: var(--warn); border-color: #5a4529; position: relative; z-index: 1; }
  .pill.attn b { color: var(--warn); }
  .live { display: inline-block; width: 6px; height: 6px; background: var(--run); margin-right: 6px; vertical-align: 1px; }

  main { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; padding: 16px 24px; }
  section { background: var(--panel); border: 1px solid var(--line); }
  section.full { grid-column: 1 / -1; }
  .sh { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .sh h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .sh .n { color: var(--muted); font-size: 12px; }
  .sh .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
  .group { padding: 7px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line-soft); background: var(--raise); }
  .group.attn { color: var(--warn); }
  .group.run { color: var(--run); }

  .id { font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; padding: 0 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; line-height: 17px; display: inline-block; }
  .tag.p1 { color: var(--accent); border-color: #3b4a66; }
  .tag.high { color: var(--bad); border-color: #5c3330; }
  :root { --bug: #e07bb5; } /* the bug tag's own colour */
  .tag.bug { color: var(--bug); border-color: #5c3550; }
  #shipped .tag.bug { margin-left: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { color: var(--text); }
  .sub { font-size: 12px; color: var(--muted); }
  .tick { display: inline-block; width: 4px; height: 8px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin: 0 6px 2px 2px; }
  .sq { display: inline-block; width: 6px; height: 6px; background: currentColor; margin: 0 6px 1px 1px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .run { color: var(--run); }

  /* Shaping */
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); }
  .head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; cursor: pointer; }
  .item .head { margin: -10px -14px -10px -12px; padding: 10px 14px 10px 12px; } /* the item's padding opens and closes it too */
  .item:last-child { border-bottom: 0; }
  .item .checks { grid-column: 1 / 2; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .item.open { background: #26282d; border-left: 2px solid var(--accent); padding-left: 12px; }
  .detail { margin-top: 10px; border-top: 1px solid var(--line-soft); padding-top: 8px; display: grid; grid-template-columns: 1fr 220px; gap: 16px; }
  .detail h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .detail p { margin: 0 0 8px; color: #bfc2c9; }
  .detail ol { margin: 0; padding-left: 18px; color: #bfc2c9; }
  .detail ol li { margin-bottom: 4px; }
  .ready { border-left: 1px solid var(--line-soft); padding-left: 14px; font-size: 12px; }
  .ready div { padding: 3px 0; }
  .set-ready { font: inherit; font-size: 12px; margin-top: 10px; padding: 3px 12px; background: transparent; color: var(--accent); border: 1px solid var(--accent); cursor: pointer; }
  .set-ready:disabled { color: var(--muted); border-color: var(--line); cursor: not-allowed; }
  .ready div.refused { white-space: pre-wrap; }
  .item.idea .id { color: var(--idea); }
  .item.inbox .id { color: var(--inbox); }

  /* Queue */
  .q { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); }
  .q:last-child { border-bottom: 0; }
  .q .top { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; }
  .q .rank { font-family: "Liberation Mono", monospace; color: var(--accent); font-size: 12px; }
  .q.wait { opacity: .5; }
  .q.wait .rank { color: var(--muted); }
  .q .indent { margin-left: 34px; }
  .question { margin: 6px 0 4px 34px; padding: 6px 10px; border-left: 2px solid var(--warn); background: #2a2621; color: #ddd3c4; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 8px 0 4px 34px; }
  .stages div { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding-top: 5px; border-top: 3px solid var(--line); }
  .stages .d { border-top-color: var(--ok); color: var(--muted); }
  .stages .now { border-top-color: var(--run); color: var(--run); }
  .act { margin-left: 34px; font-family: "Liberation Mono", monospace; font-size: 11px; color: var(--muted); }
  .act b { color: #a9adb6; font-weight: 400; }
  .q.blocked { border-left: 2px solid var(--bad); padding-left: 12px; }
  .stages .now.bad { border-top-color: var(--bad); color: var(--bad); }
  .question.exit { border-left-color: var(--bad); max-height: 16em; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; }
  .resume { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px 34px; }
  .resume .cmd { font-family: ui-monospace, monospace; font-size: 12px; color: #ddd3c4; background: #1f2126; padding: 3px 8px; user-select: all; overflow-wrap: anywhere; }
  .resume .copy { font: inherit; font-size: 11px; color: var(--muted); background: none; border: 1px solid var(--line); padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  .resume .copy:hover { color: var(--text); }
  .q .tag.high { color: var(--warn); border-color: #5a4529; }
  .next { color: var(--ok); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid #36513d; padding: 0 5px; }

  /* Shipped */
  .stats { display: flex; border-bottom: 1px solid var(--line-soft); }
  .stat { padding: 8px 14px; border-right: 1px solid var(--line-soft); }
  .stat b { font-size: 15px; font-weight: 600; margin-right: 6px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stats[hidden] { display: none; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 14px; border-bottom: 1px solid var(--line-soft); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { color: var(--muted); text-align: right; font-family: "Liberation Mono", monospace; font-size: 11px; white-space: nowrap; }

  /* Live panel additions */
  .pill.off { color: var(--bad); border-color: #5c3330; position: relative; z-index: 1; }
  .live.off { background: var(--bad); }
  .offline { font-size: 12px; color: var(--bad); padding: 6px 24px; border-bottom: 1px solid var(--line); background: #2a2020; }
  .offline[hidden] { display: none; }
  .detail ol li, .detail p.text, .question, .title { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ready div { overflow-wrap: anywhere; }

  /* Shaping: tickets, ideas and the inbox, one list at a time, each with its own accent colour */
  :root { --inbox: #4cc4b4; } /* the inbox's own colour */
  .toggles { display: flex; }
  .toggle { font: inherit; font-size: 12px; padding: 1px 10px; background: transparent; border: 1px solid var(--line); margin-left: -1px; color: var(--muted); cursor: pointer; }
  .toggle.tickets.on { color: var(--accent); border-color: var(--accent); position: relative; z-index: 1; }
  .toggle.ideas.on { color: var(--idea); border-color: var(--idea); position: relative; z-index: 1; }
  .toggle.inbox.on { color: var(--inbox); border-color: var(--inbox); position: relative; z-index: 1; }
  #shaping-section.tickets { border-top: 2px solid var(--accent); }
  #shaping-section.ideas { border-top: 2px solid var(--idea); }
  #shaping-section.inbox { border-top: 2px solid var(--inbox); }
  .item.ticket { border-left: 2px solid var(--accent); padding-left: 12px; }
  .item.idea { border-left: 2px solid var(--idea); padding-left: 12px; }
  .item.inbox { border-left: 2px solid var(--inbox); padding-left: 12px; }
  .item.ticket:hover, .item.idea:hover, .item.inbox:hover { background: #26282d; }
  .item.idea.open { border-left-color: var(--idea); }
  .item.inbox.open { border-left-color: var(--inbox); }
  .note { margin: 0; font: 12px/1.5 "Liberation Mono", monospace; color: #bfc2c9; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 10px 14px; color: var(--faint); font-size: 12px; }
  .path { overflow-wrap: anywhere; }

  /* Chains through after:: a chain icon on a ticket that unlocks others, a padlock on one that waits */
  .chain, .lock { display: inline-block; position: relative; width: 12px; height: 10px; vertical-align: -1px; cursor: help; }
  .chain { color: var(--accent); transform: rotate(-35deg); }
  .chain::before, .chain::after { content: ''; position: absolute; top: 3px; width: 6px; height: 4px; border: 1.5px solid currentColor; }
  .chain::before { left: 0; } .chain::after { left: 4px; }
  .lock { color: var(--faint); }
  .lock::before { content: ''; position: absolute; left: 3px; top: 0; width: 6px; height: 5px; border: 1.5px solid currentColor; border-bottom: 0; }
  .lock::after { content: ''; position: absolute; left: 2px; top: 4px; width: 8px; height: 6px; background: currentColor; }
  .item.hl, .q.hl { background: #262c38; }
  .item.dim, .q.dim { opacity: .35; }
</style>
</head>
<body>
<header>
  <div class="logo">speck <span>control panel</span></div>
  <div class="repo"><code>{{repo}}</code> · base <code>{{base}}</code></div>
  <div class="pills" id="pills"><div class="pill"><span class="live"></span>connecting…</div></div>
</header>
<div class="offline" id="offline" hidden>Disconnected: can't reach speck panel. Showing the last state received. Retrying every 2 seconds…</div>

<main>
  <section id="shaping-section" class="shaping tickets">
    <div class="sh"><h2>Shaping</h2><span class="toggles" id="shaping-toggle"></span><span class="hint">Gate 1 happens here · click one to open it</span></div>
    <div id="shaping"></div>
  </section>
  <section>
    <div class="sh"><h2>Queue</h2><span class="n" id="queue-n"></span><span class="hint">builds run in their own worktrees</span></div>
    <div id="queue"></div>
  </section>
  <section class="full">
    <div class="sh"><h2>Shipped</h2><span class="n" id="shipped-n"></span><span class="hint">latest 5</span></div>
    <div class="stats" id="shipped-stats" hidden></div>
    <table><tbody id="shipped"></tbody></table>
  </section>
</main>

<script>
'use strict';

// ---- model: pure, no DOM. test/panel.test.mjs runs this section on its own. ----
const IN_FLIGHT = ['building', 'reviewing', 'blocked', 'approved'];
// A ticket's five-step bar: each step is done, the current one ('now') or neither. A ready ticket has neither on every step.
function progress(t) {
  const rounds = Array.isArray(t.rounds) ? t.rounds : [];
  const last = rounds[rounds.length - 1];
  const latest = last && Number.isFinite(Number(last.round)) && last.round !== null && last.round !== '' ? Number(last.round) : rounds.length;
  const selfCheck = typeof t.self_check === 'string' && t.self_check.trim() !== '';
  const approved = t.status === 'approved';
  const done = [selfCheck || rounds.length > 0, rounds.length > 0 || (selfCheck && t.status === 'reviewing'), approved, approved, false];
  const labels = ['Build', 'Self-check', rounds.length ? `Review ${latest}` : 'Review', 'Approve', 'Ship'];
  const current = t.status === 'ready' ? -1 : approved ? 4 : done.indexOf(false); // approved: Ship is current
  return labels.map((label, i) => ({ label, state: t.status === 'ready' ? '' : done[i] ? 'done' : i === current ? 'now' : '' }));
}
// The middle value, or the mean of the two middle ones; null with no values.
function median(values) {
  const v = [...values].sort((a, b) => a - b), mid = Math.floor(v.length / 2);
  return !v.length ? null : v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2;
}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
// When a ticket shipped, in the browser's time zone: HH:MM today, otherwise D Mon HH:MM, or a dash with no time.
function shippedAt(ms, now) {
  if (ms === null) return '–';
  const d = new Date(ms), pad = n => String(n).padStart(2, '0'), hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return sameDay(d, new Date(now)) ? hm : `${d.getDate()} ${MONTHS[d.getMonth()]} ${hm}`;
}
// Links through after: among the tickets that aren't done or cancelled. For each id: the ones that list it in after:
// (unlocks, in JSON order, each once) and every ticket linked to it in either direction, through others too (linked).
function chains(tickets) {
  const open = tickets.filter(t => t.status !== 'done' && t.status !== 'cancelled');
  const ids = new Set(open.map(t => String(t.id)));
  const unlocks = new Map(), next = new Map();
  const add = (map, k, v) => { if (!map.has(k)) map.set(k, []); if (!map.get(k).includes(v)) map.get(k).push(v); };
  for (const t of open) {
    const id = String(t.id);
    add(next, id, id);
    for (const a of Array.isArray(t.after) ? t.after.map(String) : []) {
      if (a === id) continue;
      add(unlocks, a, id);
      if (ids.has(a)) { add(next, id, a); add(next, a, id); }
    }
  }
  const linked = new Map();
  for (const id of ids) {
    if (linked.has(id)) continue;
    const group = [id];
    for (let i = 0; i < group.length; i++) for (const n of next.get(group[i]) || []) if (!group.includes(n)) group.push(n);
    for (const n of group) linked.set(n, group);
  }
  return { unlocks: id => unlocks.get(String(id)) || [], linked: id => linked.get(String(id)) || [String(id)] };
}
// A word for a POSIX shell: as it is when it's only letters, digits, /, ., _ and -, otherwise in single quotes.
const shellWord = w => (/^[A-Za-z0-9\/._-]+$/.test(w) ? w : `'${w.replace(/'/g, "'\\''")}'`);
// How to reopen a blocked build's session: `cd <folder> && <resume_command>` with {session} put in, or only
// "session <id>" when resume_command is blank. null for a ticket that isn't blocked or has no session.
function resumeOf(t, resumeCommand) {
  const s = t.session;
  if (t.status !== 'blocked' || !s || typeof s !== 'object' || typeof s.id !== 'string' || !s.id || typeof s.cwd !== 'string' || !s.cwd) return null;
  const cmd = typeof resumeCommand === 'string' ? resumeCommand.trim() : '';
  if (!cmd) return { text: `session ${s.id}`, command: false };
  return { text: `cd ${shellWord(s.cwd)} && ${cmd.split('{session}').join(shellWord(s.id))}`, command: true };
}
function panelModel(state) {
  const tickets = (state && Array.isArray(state.tickets) ? state.tickets : []).filter(t => t && t.status !== 'cancelled');
  const links = chains(tickets);
  // A ticket starts a chain when it waits on nothing and an unfinished ticket waits on it.
  const chain = t => {
    const waiting_on = Array.isArray(t.waiting_on) ? t.waiting_on : [], unlocks = links.unlocks(t.id);
    return { ...t, waiting_on, unlocks, chain: !waiting_on.length && unlocks.length > 0, linked: links.linked(t.id) };
  };
  const ideas = (state && Array.isArray(state.ideas) ? state.ideas : []).filter(i => i);
  const statusOf = i => String(i.status || '').trim();
  // The id on an inbox note's `From ticket:` line (0036), or null when it has none.
  const fromTicket = body => ((typeof body === 'string' ? body : '').match(/^From ticket:[ \t]*(\S+)/m) || [])[1] || null;
  const is = (...statuses) => t => statuses.includes(t.status);
  const rounds = t => (Array.isArray(t.rounds) ? t.rounds : []);
  const time = v => { const n = typeof v === 'string' ? Date.parse(v) : NaN; return Number.isFinite(n) ? n : null; };
  const now = Date.now();
  const done = tickets.filter(is('done')).map(t => {
    const start = time(t.started), end = time(t.finished);
    return { ...t, end, when: shippedAt(end, now), roundCount: rounds(t).length, tokens: rounds(t).reduce((n, r) => n + (Number(r && r.tokens) || 0), 0),
      exactMinutes: start !== null && end !== null ? (end - start) / 60000 : null,
      minutes: start !== null && end !== null ? Math.round((end - start) / 60000) : null };
  });
  // Each median covers the done tickets that have its data: both times, at least one review round, or tokens recorded.
  const stat = (values, round) => { const m = median(values); return { median: m === null ? null : round(m), count: values.length }; };
  // Newest finished first; done tickets with no finished time keep their JSON order after those. Then the latest 5.
  const finished = done.filter(t => t.end !== null).sort((a, b) => b.end - a.end);
  return {
    drafts: tickets.filter(is('draft')).map(chain),
    // The user's own ideas still to shape, in JSON order: inbox, dropped and ticketed notes are left out.
    ideas: ideas.filter(i => !['inbox', 'dropped'].includes(statusOf(i)) && !String(i.status || '').startsWith('ticketed')),
    // Follow-ups waiting in the inbox, in JSON order.
    inbox: ideas.filter(i => statusOf(i) === 'inbox').map(i => ({ ...i, from: fromTicket(i.body) })),
    // One list: in-flight tickets, then ready ones, each group in JSON order.
    queue: [...tickets.filter(is(...IN_FLIGHT)), ...tickets.filter(is('ready'))].map(chain).map(t => {
      const inFlight = t.status !== 'ready', start = time(t.started);
      // A build from speck run that has exited while its ticket is still in hand needs you, as a blocked ticket does.
      const exited = t.build_exit && typeof t.build_exit === 'object' && t.status !== 'blocked';
      const exit_label = !exited ? null : t.status === 'approved' ? 'Build finished without shipping'
        : t.status === 'building' || t.status === 'reviewing' ? 'Build stopped before finishing' : null;
      return { ...t, inFlight, steps: progress(t), red: t.status === 'blocked' || exit_label !== null, exit_label, resume: resumeOf(t, state.resume_command),
        exit_message: exit_label && typeof t.build_exit.message === 'string' ? t.build_exit.message : null,
        minutes: inFlight && start !== null ? Math.max(0, Math.floor((Date.now() - start) / 60000)) : null };
    }),
    shipped: [...finished, ...done.filter(t => t.end === null)].slice(0, 5),
    shippedTotal: done.length,
    stats: {
      today: done.filter(t => t.end !== null && sameDay(new Date(t.end), new Date(now))).length,
      minutes: stat(done.filter(t => t.exactMinutes !== null).map(t => t.exactMinutes), Math.round),
      rounds: stat(done.filter(t => t.roundCount > 0).map(t => t.roundCount), n => Math.round(n * 10) / 10),
      tokens: stat(done.filter(t => t.tokens > 0).map(t => t.tokens), Math.round),
    },
  };
}
// ---- end model ----

// ---- view: builds every node with createElement and textContent, so ticket text is never read as HTML ----
const POLL_MS = 2000;
const TOKEN = '{{token}}'; // put in by the server each time it starts, and sent with Set ready
const $ = id => document.getElementById(id);
function el(tag, cls, text, ...kids) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  for (const k of kids) if (k) node.appendChild(k);
  return node;
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + 's'}`;
const mark = (cls, ok) => el('span', cls, null, el('span', ok ? 'tick' : 'sq'));
function check(cls, ok, text) { const s = mark(cls, ok); s.appendChild(el('span', null, text)); return s; }
// A chain icon on a ticket that starts a chain, a padlock on one waiting on others, or nothing. Hover text says which.
function chainIcon(t) {
  const icon = t.chain ? el('span', 'chain') : t.waiting_on.length ? el('span', 'lock') : null;
  if (icon) icon.title = t.chain ? `Starts a chain: unlocks ${t.unlocks.join(', ')}` : `Waiting on ${t.waiting_on.join(', ')}`;
  return icon;
}
// A "bug" tag for a bug ticket, or nothing.
const bugTag = t => (t.type === 'bug' ? el('span', 'tag bug', 'bug') : null);
function tags(t, icon) {
  const row = el('div', 'row', null, el('span', 'id', t.id), bugTag(t), icon, el('span', 'title', t.title));
  if (t.priority !== undefined && t.priority !== null && t.priority !== '') row.appendChild(el('span', t.priority === 1 ? 'tag p1' : 'tag', `P${t.priority}`));
  if (t.size) row.appendChild(el('span', 'tag', t.size));
  if (t.risk) row.appendChild(el('span', t.risk === 'high' ? 'tag high' : 'tag', t.risk));
  return row;
}
// View state only, kept across refreshes and never sent to the server.
let shapingView = 'tickets'; // which Shaping list is showing: 'tickets', 'ideas' or 'inbox'
const open = new Set(); // ids of the open tickets
const openIdeas = new Set(); // paths of the open ideas
const openInbox = new Set(); // paths of the open inbox notes
const settingReady = new Set(); // ids whose Set ready request hasn't been answered yet
const refused = new Map(); // id → why the server refused to set it ready

// Gate 1 from the panel: the server sets the ticket ready and commits it, and the next refresh moves it to the queue.

async function setReady(id) {

// Fetches the state every 2 seconds without reloading the page. Each poll schedules the next one before it starts, so
