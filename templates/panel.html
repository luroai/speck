<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="speck">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="status-bar">
<meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>speck · control panel</title>
<script id="theme-start">
// 0136: set the look before the page is first drawn: the one last chosen in this browser (in Settings since 0372), or
// else the computer's light or dark setting, followed as it changes until a choice is made.
(() => {
  const root = document.documentElement;
  const saved = () => { try { const t = localStorage.getItem('speck-theme'); return t === 'light' || t === 'dark' ? t : null; } catch { return null; } };
  const system = matchMedia('(prefers-color-scheme: dark)');
  // 0160: the home-screen app's status bar: black-translucent (light text) on the dark look, default (dark text) on the
  // light one. iOS reads it as the app opens.
  // 0448: and the phone's top bar, from theme-color: both tags take the look's page colour, so the one whose media
  // matches the phone's own setting shows the look chosen in Settings.
  const bar = look => {
    const m = document.getElementById?.('status-bar'); if (m) m.content = look === 'dark' ? 'black-translucent' : 'default';
    for (const t of document.querySelectorAll?.('meta[name="theme-color"]') || []) t.content = look === 'dark' ? '#141414' : '#f3f3f3';
  };
  // 0372: Settings' look, while it's open, shows the one the page has (0396: drawn by the page's drawLook).
  const set = look => { root.dataset.theme = look; bar(look); if (typeof globalThis.drawLook === 'function') globalThis.drawLook(); };
  // 0412: System, Light or Dark: the one picked in this page, or else the one kept in this browser, or else System,
  // which follows the computer's setting.
  let picked = null;
  const choice = () => picked || saved() || 'system';
  set(choice() === 'system' ? (system.matches ? 'dark' : 'light') : choice());
  system.addEventListener('change', e => { if (choice() === 'system') set(e.matches ? 'dark' : 'light'); });
  globalThis.setLook = set; // for Settings' look
  globalThis.lookChoice = choice;
  globalThis.pickLook = c => {
    if (c !== 'system' && c !== 'light' && c !== 'dark') return;
    picked = c;
    set(c === 'system' ? (system.matches ? 'dark' : 'light') : c);
  };
})();
</script>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<header>
  <div class="bezel" id="bezel">
    <div class="print"><b class="name">speck</b><span class="repo">{{repo}} · <code>{{base}}</code></span><button class="settings-open" id="settings-open" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12"/><circle cx="5.5" cy="4.5" r="1.6" fill="var(--bezel)"/><circle cx="10.5" cy="11.5" r="1.6" fill="var(--bezel)"/></svg>
    </button></div>
    <button class="glass" id="run" type="button" aria-label="The Foreman" aria-expanded="false" aria-controls="foreman" title="What speck run is doing, and what is waiting"><canvas class="lcd" id="screen" aria-hidden="true"></canvas></button>
  </div>
</header>
<div class="offline" id="offline" hidden>Disconnected: can't reach speck panel. Showing the last state received. Retrying every 2 seconds…</div>
<div class="restart" id="restart" hidden></div>
<div class="run-error" id="run-error" hidden></div>

<nav class="tabs" id="tabs" role="tablist" aria-label="Lanes">
  <button class="tab" id="tab-plan" type="button" role="tab" aria-selected="false" aria-controls="shaping-section"><span class="tab-name">Plan</span></button>
  <button class="tab" id="tab-build" type="button" role="tab" aria-selected="true" aria-controls="build-section"><span class="tab-name">Build</span><span class="needs" id="build-needs"></span></button>
  <button class="tab" id="tab-shipped" type="button" role="tab" aria-selected="false" aria-controls="shipped-section"><span class="tab-name">Shipped</span></button>
</nav>
<main>
  <section id="shaping-section" class="shaping tickets" role="tabpanel" aria-labelledby="tab-plan" tabindex="-1" hidden>
    <div class="sh"><span class="toggles" id="shaping-toggle"></span></div>
    <div id="shaping" class="lane-list"></div>
  </section>
  <section id="build-section" role="tabpanel" aria-labelledby="tab-build" tabindex="-1">
    <div class="lane-n" id="queue-n"></div>
    <div id="queue" class="lane-list"></div>
  </section>
  <section id="shipped-section" class="shipped" role="tabpanel" aria-labelledby="tab-shipped" tabindex="-1" hidden>
    <div class="lane-n" id="shipped-n"></div>
    <div class="lane-list" id="shipped-list">
      <div class="stats-line" id="shipped-stats-line" hidden><div id="shipped-stats" hidden></div><button class="full-open more-stats" id="more-stats" type="button" aria-expanded="false" aria-controls="shipped-more" hidden></button></div>
      <div class="stats" id="shipped-more" hidden></div>
      <table><tbody id="shipped"></tbody></table>
    </div>
  </section>
</main>
<div id="full-backdrop" hidden></div>
<aside id="full-ticket" tabindex="-1" hidden></aside>
<div id="doc-view" tabindex="-1" role="dialog" aria-modal="true" aria-label="Document" hidden></div>
<div class="foreman" id="foreman" tabindex="-1" role="dialog" aria-modal="true" aria-label="Pipeline" hidden></div>
<div id="settings-backdrop" hidden></div>
<div id="settings" tabindex="-1" role="dialog" aria-modal="true" aria-label="Settings" hidden></div>
<div id="settings-unsaved" hidden></div>
<div id="tag-tip" role="tooltip" hidden></div>

<script src="/panel-model.js"></script>
<script src="/lcd.js"></script>
<script src="/panel.js" data-page="{{page}}" data-token="{{token}}"></script>
<script src="/panel-settings.js"></script>
</body>
</html>
