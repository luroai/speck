<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>speck · control panel</title>
<script id="theme-start">
// 0136: set the look before the page is first drawn: the one last chosen with the button in this browser, or else the
// computer's light or dark setting, followed as it changes until a choice is made.
(() => {
  const root = document.documentElement;
  const saved = () => { try { const t = localStorage.getItem('speck-theme'); return t === 'light' || t === 'dark' ? t : null; } catch { return null; } };
  const system = matchMedia('(prefers-color-scheme: dark)');
  root.dataset.theme = saved() || (system.matches ? 'dark' : 'light');
  system.addEventListener('change', e => { if (!saved()) root.dataset.theme = e.matches ? 'dark' : 'light'; });
})();
</script>
<style>
  :root {
    --bg: #ecebdf; --panel: #f4f4ea; --raise: #e1e1d2; --line: #bfbfb5; --line-soft: #d7d7cc;
    --text: #1f2521; --muted: #474e47; --faint: #858b7f;
    --accent: #4c6b52; --ok: #3d7a45; --warn: #9a6512; --bad: #b0412e; --run: #2f6688; --idea: #76589a;
    --inbox: #2b7a70; /* the inbox's own colour */
    --bug: #a2457a; /* the bug tag's own colour */
    --fix: #7f6a12; /* the fix tag's own colour */
  }
  /* The zen look: a serif for headings and ticket titles, a light sans for body text and a monospace for labels. Each
     names the zen fonts first, used when they're installed, and none is loaded from another host. */
  * { box-sizing: border-box; border-radius: 0 !important; }
  body { margin: 0; font: 300 13px/1.5 "Zen Kaku Gothic New", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  b, strong { font-weight: 600; }
  code, .mono, .id { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  code { font-size: 12px; color: var(--muted); }

  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: .5px solid var(--line); background: var(--bg); }
  .logo { font-family: "Shippori Mincho", Georgia, serif; font-weight: 600; font-size: 18px; }
  .logo span { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--faint); font-weight: 400; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; margin-left: 6px; }
  .repo { color: var(--muted); font-size: 12px; }
  .pills { margin-left: auto; display: flex; gap: 0; }
  .pill { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 4px 12px; border: .5px solid var(--line); margin-left: -.5px; color: var(--muted); background: var(--panel); }
  .pill b { color: var(--text); font-weight: 500; }
  .pill.attn { color: var(--warn); border-color: var(--warn); position: relative; z-index: 1; }
  .pill.attn b { color: var(--warn); }
  .theme { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: .5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .theme:hover { border-color: var(--text); color: var(--text); }
  .theme svg { width: 15px; height: 15px; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }
  .live { display: inline-block; width: 6px; height: 6px; background: var(--run); margin-right: 6px; vertical-align: 1px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 20px 24px; }
  section { background: var(--panel); border: .5px solid var(--line); }
  section.full { grid-column: 1 / -1; }
  .sh { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: .5px solid var(--line); }
  .sh h2 { margin: 0; font-family: "Shippori Mincho", Georgia, serif; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .sh .n { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); font-size: 11px; }
  .sh .hint { margin-left: auto; font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
  .group { padding: 7px 14px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); border-bottom: .5px solid var(--line-soft); background: var(--raise); }
  .group.attn { color: var(--warn); }
  .group.run { color: var(--run); }

  .id { font-size: 12px; color: var(--muted); }
  .tag { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; padding: 0 6px; border: .5px solid var(--line); color: var(--muted); white-space: nowrap; line-height: 17px; display: inline-block; }
  .tag.p1 { color: var(--accent); border-color: var(--accent); }
  .tag.high { color: var(--warn); border-color: var(--warn); }
  .tag.bug { color: var(--bug); border-color: var(--bug); }
  .tag.fix { color: var(--fix); border-color: var(--fix); }
  #shipped .tag.bug, #shipped .tag.fix { margin-left: 8px; }
  .prio { position: relative; display: inline-block; }
  .tag.pick { cursor: pointer; }
  .tag.pick:hover { color: var(--text); border-color: var(--muted); }
  .prio-menu { position: absolute; top: calc(100% + 2px); left: 0; z-index: 5; display: flex; background: var(--panel); border: .5px solid var(--line); }
  .prio-menu button { font: inherit; font-size: 10px; padding: 1px 8px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
  .prio-menu button:hover { color: var(--text); }
  .prio-menu button.on { color: var(--accent); }
  .item .prio-refused { margin-top: 6px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-family: "Shippori Mincho", Georgia, serif; font-size: 14px; color: var(--text); }
  .sub { font-size: 12px; color: var(--muted); }
  .tick { display: inline-block; width: 4px; height: 8px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin: 0 6px 2px 2px; }
  .sq { display: inline-block; width: 6px; height: 6px; background: currentColor; margin: 0 6px 1px 1px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .run { color: var(--run); }

  /* Shaping */
  .item { padding: 10px 14px; border-bottom: .5px solid var(--line-soft); }
  .head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; cursor: pointer; }
  .item .head { margin: -10px -14px -10px -12px; padding: 10px 14px 10px 12px; } /* the item's padding opens and closes it too */
  .item:last-child { border-bottom: 0; }
  .item .checks { grid-column: 1 / 2; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .item.open { background: var(--raise); border-left: 2px solid var(--accent); padding-left: 12px; }
  .detail { margin-top: 10px; border-top: .5px solid var(--line-soft); padding-top: 8px; display: grid; grid-template-columns: 1fr 220px; gap: 16px; }
  .detail h4 { margin: 0 0 4px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 400; }
  .detail p { margin: 0 0 8px; color: var(--text); }
  .detail ol { margin: 0; padding-left: 18px; color: var(--text); }
  .detail ol li { margin-bottom: 4px; }
  .ready { border-left: .5px solid var(--line-soft); padding-left: 14px; font-size: 12px; }
  .ready div { padding: 3px 0; }
  .set-ready { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-top: 10px; padding: 4px 12px; background: var(--accent); color: var(--panel); border: .5px solid var(--accent); cursor: pointer; }
  .set-ready:disabled { background: transparent; color: var(--faint); border-color: var(--line); cursor: not-allowed; }
  .ready div.refused { white-space: pre-wrap; }
  .item.idea .id { color: var(--idea); }
  .item.inbox .id { color: var(--inbox); }

  /* Queue */
  .q { padding: 10px 14px; border-bottom: .5px solid var(--line-soft); }
  .q:last-child { border-bottom: 0; }
  .q .top { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; cursor: pointer; }
  .q .log { margin: 6px 0 4px 34px; padding: 6px 10px; height: 24em; max-height: 24em; overflow-y: auto; background: var(--bg); border-left: 2px solid var(--line-soft);
    font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
  .q .rank { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--accent); font-size: 12px; }
  .q.wait { opacity: .5; }
  .q.wait .rank { color: var(--muted); }
  /* A running build's pause icon (two bars), or a paused one's play icon (a triangle), in the rank space. It is centred
     between the top row and the bottom of the progress bar under it: half the top row, plus half the bar (8px margin, 3px
     border, 5px padding and a 15px label) less half the icon. Opening the row leaves it there, as the top row doesn't move. */
  .q .top { position: relative; }
  .q .toggle-build { position: absolute; left: 0; top: calc(50% + 15.5px - 7px); width: 16px; height: 14px; padding: 0; background: none; border: 0; color: var(--muted); cursor: pointer; }
  .q .toggle-build:hover { color: var(--text); }
  .q .toggle-build.pause::before, .q .toggle-build.pause::after { content: ''; position: absolute; top: 2px; width: 3px; height: 10px; background: currentColor; }
  .q .toggle-build.pause::before { left: 4px; } .q .toggle-build.pause::after { left: 9px; }
  .q .toggle-build.play::before { content: ''; position: absolute; top: 2px; left: 5px; border: 5px solid transparent; border-left: 8px solid currentColor; border-right: 0; }
  .q .toggle-refused { margin: 4px 0 0 34px; font-size: 12px; color: var(--bad); white-space: pre-wrap; }
  /* An open running or paused build's Stop build button, beside Full ticket, and why the server refused it */
  .q .stop-build { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 2px 8px; padding: 1px 10px; background: transparent; color: var(--muted); border: .5px solid var(--line); cursor: pointer; }
  .q .stop-build:hover { color: var(--bad); border-color: var(--bad); }
  .q .stop-build:disabled { cursor: default; opacity: .6; }
  .q .stop-refused { margin: 4px 0 0 34px; font-size: 12px; color: var(--bad); white-space: pre-wrap; }
  .q .indent { margin-left: 34px; }
  .question { margin: 6px 0 4px 34px; padding: 6px 10px; border-left: 2px solid var(--bad); background: var(--bad-bg); color: var(--text); }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 8px 0 4px 34px; }
  .stages div { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .12em; padding-top: 5px; border-top: 3px solid var(--line-soft); }
  .stages .d { border-top-color: var(--ok); color: var(--muted); }
  .stages .now { border-top-color: var(--run); color: var(--run); }
  .act { margin-left: 34px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; color: var(--muted); }
  .act b { color: var(--text); font-weight: 400; }
  .q.blocked { border-left: 2px solid var(--bad); padding-left: 12px; }
  .stages .now.bad { border-top-color: var(--bad); color: var(--bad); }
  /* An approved ticket whose build has exited is waiting for you to ship it: purple, as nothing is wrong (0138) */
  .q.to-ship { border-left: 2px solid var(--idea); padding-left: 12px; }
  .stages .now.to-ship { border-top-color: var(--idea); color: var(--idea); }
  .act.to-ship { color: var(--idea); }
  /* A step a build is working on now: a dot of light moves side to side along its line, unless the browser asks for reduced motion */
  @media (prefers-reduced-motion: no-preference) {
    .stages .now.moving { position: relative; }
    .stages .now.moving::after { content: ''; position: absolute; top: -3px; left: 0; width: 16px; height: 3px;
      background: linear-gradient(90deg, transparent, var(--panel), transparent); animation: sweep 1.6s ease-in-out infinite alternate; }
    @keyframes sweep { to { left: calc(100% - 16px); } }
  }
  .question.exit.to-ship { border-left-color: var(--idea); }
  .question.exit { border-left-color: var(--bad); max-height: 16em; overflow-y: auto; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  .resume { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px 34px; }
  .resume .cmd { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); background: var(--raise); padding: 3px 8px; user-select: all; overflow-wrap: anywhere; }
  .resume .copy { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: none; border: .5px solid var(--line); padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  .resume .copy:hover { color: var(--text); }
  .q .tag.high { color: var(--warn); border-color: var(--warn); }
  .next { color: var(--ok); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; border: .5px solid var(--ok); padding: 0 5px; }

  /* Shipped */
  .stats { display: flex; border-bottom: .5px solid var(--line-soft); }
  .stat { padding: 8px 14px; border-right: .5px solid var(--line-soft); }
  .stat b { font-family: "Shippori Mincho", Georgia, serif; font-size: 18px; font-weight: 600; margin-right: 6px; }
  .stat span { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .stats[hidden] { display: none; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 14px; border-bottom: .5px solid var(--line-soft); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { color: var(--muted); text-align: right; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; white-space: nowrap; }

  /* Live panel additions */
  .pill.off { color: var(--bad); border-color: var(--bad); position: relative; z-index: 1; }
  .live.off { background: var(--bad); }
  .live.idle { background: var(--faint); }
  .run-state + .pills { margin-left: 0; }
  .run-switch { display: flex; align-items: center; }
  .run-switch button { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 10px; margin-right: 10px; background: transparent; color: var(--muted); border: .5px solid var(--line); cursor: pointer; }
  .run-switch button:hover { color: var(--text); border-color: var(--text); }
  .run-switch button:disabled { cursor: default; opacity: .6; }
  .run-error { font-size: 12px; color: var(--bad); padding: 6px 24px; border-bottom: .5px solid var(--line); background: var(--bad-bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .run-error[hidden] { display: none; }
  .offline { font-size: 12px; color: var(--bad); padding: 6px 24px; border-bottom: .5px solid var(--line); background: var(--bad-bg); }
  .offline[hidden] { display: none; }
  .restart { font-size: 12px; color: var(--warn); padding: 6px 24px; border-bottom: .5px solid var(--line); background: var(--raise); }
  .restart[hidden] { display: none; }
  .detail ol li, .detail p.text, .question, .title { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ready div { overflow-wrap: anywhere; }

  /* Shaping: tickets, ideas and the inbox, one list at a time, each with its own accent colour */
  .toggles { display: flex; }
  .toggle { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 1px 10px; background: transparent; border: .5px solid var(--line); margin-left: -.5px; color: var(--muted); cursor: pointer; }
  .toggle.tickets.on { color: var(--accent); border-color: var(--accent); position: relative; z-index: 1; }
  .toggle.ideas.on { color: var(--idea); border-color: var(--idea); position: relative; z-index: 1; }
  .toggle.inbox.on { color: var(--inbox); border-color: var(--inbox); position: relative; z-index: 1; }
  #shaping-section.tickets { border-top: 2px solid var(--accent); }
  #shaping-section.ideas { border-top: 2px solid var(--idea); }
  #shaping-section.inbox { border-top: 2px solid var(--inbox); }
  .item.ticket { border-left: 2px solid var(--accent); padding-left: 12px; }
  .item.idea { border-left: 2px solid var(--idea); padding-left: 12px; }
  .item.inbox { border-left: 2px solid var(--inbox); padding-left: 12px; }
  .item.ticket:hover, .item.idea:hover, .item.inbox:hover { background: var(--raise); }
  .item.idea.open { border-left-color: var(--idea); }
  .item.inbox.open { border-left-color: var(--inbox); }
  /* The open item in Shaping or the queue is tinted with its list's colour */
  :root { --accent-bg: #e3e7da; --idea-bg: #e8e3e8; --inbox-bg: #dfe8e1; --bad-bg: #f0e0d6; }
  .item.ticket.open, .item.ticket.open:hover { background: var(--accent-bg); }
  .item.idea.open, .item.idea.open:hover { background: var(--idea-bg); }
  .item.inbox.open, .item.inbox.open:hover { background: var(--inbox-bg); }
  .q.open { background: var(--accent-bg); border-left: 2px solid var(--accent); padding-left: 12px; }
  .q.blocked.open { background: var(--bad-bg); border-left-color: var(--bad); }
  .q.to-ship.open { background: var(--idea-bg); border-left-color: var(--idea); }
  .note { margin: 0; font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 10px 14px; color: var(--faint); font-size: 12px; }
  .path { overflow-wrap: anywhere; }

  /* Chains through after:: a chain icon on a ticket that unlocks others, a padlock on one that waits */
  .chain, .lock { display: inline-block; position: relative; width: 12px; height: 10px; vertical-align: -1px; cursor: help; }
  .chain { color: var(--accent); transform: rotate(-35deg); }
  .chain::before, .chain::after { content: ''; position: absolute; top: 3px; width: 6px; height: 4px; border: 1.5px solid currentColor; }
  .chain::before { left: 0; } .chain::after { left: 4px; }
  .lock { color: var(--faint); }
  .lock::before { content: ''; position: absolute; left: 3px; top: 0; width: 6px; height: 5px; border: 1.5px solid currentColor; border-bottom: 0; }
  .lock::after { content: ''; position: absolute; left: 2px; top: 4px; width: 8px; height: 6px; background: currentColor; }
  .item.hl, .q.hl { background: var(--accent-bg); }
  .item.dim, .q.dim { opacity: .35; }

  /* The full ticket, in a side pane over the right of the page. While it's open, the page behind it holds still and a
     backdrop over the rest of the page takes every click outside it. */
  html.held { overflow: hidden; }
  #full-backdrop { position: fixed; inset: 0; z-index: 9; background: rgba(31, 37, 33, .2); touch-action: none; }
  #full-backdrop[hidden] { display: none; }
  .full-open { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 10px 0 0 8px; padding: 4px 12px; background: transparent; color: var(--muted); border: .5px solid var(--line); cursor: pointer; }
  .full-open:hover { color: var(--text); }
  .q .full-open { margin: 6px 0 2px 34px; padding: 1px 10px; font-size: 10px; }
  td.full-cell { width: 1%; padding-left: 0; }
  td .title-link { color: var(--accent); text-decoration: none; cursor: pointer; }
  td .title-link:hover { text-decoration: underline; }
  td .full-open { margin: 0; padding: 0 8px; font-size: 10px; white-space: nowrap; }
  #full-ticket { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); overflow-y: auto; overscroll-behavior: contain; z-index: 10; background: var(--panel); border-left: 2px solid var(--accent); padding: 0 16px 16px; box-shadow: -8px 0 24px rgba(31, 37, 33, .12); }
  #full-ticket[hidden] { display: none; }
  #full-ticket:focus { outline: none; }
  #full-ticket .top { display: flex; align-items: baseline; gap: 8px; padding: 12px 0 10px; border-bottom: .5px solid var(--line-soft); margin-bottom: 10px; }
  #full-ticket .close { margin-left: auto; font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: none; border: .5px solid var(--line); padding: 1px 8px; cursor: pointer; }
  #full-ticket .close:hover { color: var(--text); }
  #full-ticket .ready { border-left: 0; padding: 0 0 10px; margin-bottom: 10px; border-bottom: .5px solid var(--line-soft); }
  #full-ticket h4 { margin: 0 0 4px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 400; }
  #full-ticket .md, #full-ticket ol.criteria { margin: 0 0 10px; color: var(--text); overflow-wrap: anywhere; }
  #full-ticket ol.criteria { padding-left: 18px; }
  #full-ticket ol.criteria > li { margin-bottom: 4px; }
  /* Each section's Markdown. Its headings rank below the section's own (h4) and are no taller than body text. */
  #full-ticket .md p, #full-ticket .criteria p { margin: 0 0 8px; }
  #full-ticket .md > :last-child, #full-ticket li > :last-child { margin-bottom: 0; }
  #full-ticket .md ul, #full-ticket .md ol, #full-ticket .criteria ul, #full-ticket .criteria ol { margin: 0 0 8px; padding-left: 20px; }
  #full-ticket li ul, #full-ticket li ol { margin: 2px 0 0; }
  #full-ticket h5, #full-ticket h6 { margin: 10px 0 4px; font-family: "Shippori Mincho", Georgia, serif; color: var(--text); font-weight: 600; }
  #full-ticket .md-h1 { font-size: 13px; }
  #full-ticket .md-h2 { font-size: 12px; }
  #full-ticket .md-h3 { font-size: 12px; color: var(--muted); }
  #full-ticket code.md-code { background: var(--raise); border: .5px solid var(--line-soft); padding: 0 4px; }

  const line = el('div', 'resume', null, el('code', 'cmd', t.resume.text));
  if (!t.resume.command) return line;
  const shown = copied.get(t.id);
  const b = el('button', 'copy', shown ? shown[1] : 'Copy');
  b.type = 'button';
  b.addEventListener('click', e => { e.stopPropagation(); copy(t.id, t.resume.text); });
  copyButtons.set(t.id, b);
  line.appendChild(b);
  return line;
}
async function copy(id, text) {
  const mine = ++copies;
  let said = 'Copied';
  try { await navigator.clipboard.writeText(text); } catch { said = "Couldn't copy: select the command instead"; }
  copied.set(id, [mine, said]);
  copyLabel(id);
  setTimeout(() => { if (copied.has(id) && copied.get(id)[0] === mine) { copied.delete(id); copyLabel(id); } }, 2000);
}
// The label is put right on the button, so the row it's in, and any text selected there, stays.
function copyLabel(id) {
  const b = copyButtons.get(id);
  if (b) b.textContent = copied.has(id) ? copied.get(id)[1] : 'Copy';
}
// Hovering a ticket in Shaping or a ready one in the queue lights it and every ticket linked to it through after:, and dims the rest.
// The classes are set on the nodes in place, so a Shaping item keeps its node (and any text selected in it).
let hovered = null; // the id of the ticket under the pointer, or null
let linked = new Map(); // id → the ids linked to it, from the last render
function hoverable(node, t) {
  node.ticketId = String(t.id);
  node.addEventListener('mouseenter', () => { hovered = node.ticketId; lightUp(); });
  node.addEventListener('mouseleave', () => { if (hovered === node.ticketId) hovered = null; lightUp(); });
  return node;
}
function lightUp() {
  const rows = [...$('shaping').children, ...$('queue').children].filter(n => n.ticketId !== undefined);
  if (!rows.some(n => n.ticketId === hovered)) hovered = null; // it has left the page, with no mouseleave
  const group = hovered !== null && linked.get(hovered);
  for (const n of rows) {
    const cls = n.className.replace(/ (hl|dim)\b/g, '');
    n.className = !group ? cls : `${cls} ${group.includes(n.ticketId) ? 'hl' : 'dim'}`;
  }
}
// Puts the nodes in the box in order, leaving in place any that are already there, so a node kept from the last
// render is never taken out of the page (a browser drops any text selected in a node it takes out).
function fill(id, nodes, emptyText) {
  const box = $(id), want = nodes.length ? nodes : [el('div', 'empty', emptyText)];
  for (const c of [...box.children]) if (!want.includes(c)) box.removeChild(c);
  want.forEach((n, i) => { if (box.children[i] !== n) box.insertBefore(n, box.children[i] || null); });
}
// The items built by the last render, for each box, by key ('t:<id>' or 'i:<path>' in Shaping, the id elsewhere), each
// with everything it shows. An item whose own data and view state are unchanged keeps its node, so text selected in it,
// and a box's scroll position, survive the refresh. What it shows from other items or the clock (`derived`) is put
// right with `update`, on the node it keeps.
const built = new Map();
// The same field values give the same signature, whatever order the fields come in, at every level.
const signature = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(f => [f, x[f]])) : x));
function keptItems(box, list, keyOf, viewOf, make, { own = x => x, derived = () => null, update = () => {} } = {}) {
  const before = built.get(box) || new Map(), now = new Map();
  const nodes = list.map(x => {
    const key = keyOf(x), sig = signature([own(x), viewOf(x)]), from = signature(derived(x)), last = before.get(key);
    if (now.has(key)) return make(x); // a repeated id or path: built afresh each time, as it can't share a node
    const kept = last && last.sig === sig, node = kept ? last.node : make(x);
    if (kept && last.from !== from) update(node, x);
    now.set(key, { sig, from, node });
    return node;
  });
  built.set(box, now);
  return nodes;
}

let state = null, lastOk = null, connected = null;
function render() {
  if (!state) return;
  const m = panelModel(state);
  // A menu whose ticket isn't showing any more is closed, so it can't catch the next click.
  if (priorityMenu !== null && (shapingView !== 'tickets' || !m.drafts.some(t => String(t.id) === priorityMenu))) priorityMenu = null;
  shapingToggle(m);
  // A refused stop's reason goes once its ticket has no Stop build button, so a later build of it doesn't show it.
  for (const id of stopRefused.keys()) if (!m.queue.some(t => String(t.id) === id && t.pausable)) stopRefused.delete(id);
  if (shapingView === 'inbox') fill('shaping', keptItems('shaping', m.inbox, i => `n:${i.path}`, i => openInbox.has(i.path), inboxItem), 'Inbox is empty.');
  else if (shapingView === 'ideas') fill('shaping', keptItems('shaping', m.ideas, i => `i:${i.path}`, i => openIdeas.has(i.path), ideaItem), 'No ideas waiting.');
  else fill('shaping', keptItems('shaping', m.drafts, t => `t:${t.id}`,
    t => [open.has(t.id), settingReady.has(t.id), refused.get(t.id) ?? null, priorityMenu === String(t.id), priorityRefused.get(String(t.id)) ?? null], ticketItem,
    { own: ownData, derived: t => [t.chain, t.unlocks], update: newHead }), 'No draft tickets.');
  renderFull(m);

  // The counter comes from the clock, not the ticket, so it is put right on a kept row.
  // A log box is kept through the refresh while its ticket is unchanged, and each new log is put in it in place (showLog).
  const rows = keptItems('queue', m.queue, t => String(t.id), t => [openQueue.has(String(t.id)), shippingId === String(t.id), toggleRefused.get(String(t.id)) ?? null, stopping.has(String(t.id)), stopRefused.get(String(t.id)) ?? null], queueItem,
    { own: t => { const { counter, ...own } = ownData(t); return own; }, derived: t => [t.counter, t.chain, t.unlocks], update: queueUpdate });
  fill('queue', rows, 'Nothing in flight or ready.');
  startCounters(m.queue.flatMap((t, i) => (t.counter !== null && t.approved_at === null ? [[child(child(rows[i], 'top'), 'sub'), t.since, !!t.paused]] : [])));
  for (const [box, top] of logScroll) box.scrollTop = top === null ? box.scrollHeight : top;
  logScroll.clear();
  queueIds = new Set(m.queue.map(t => String(t.id)));
  linked = new Map([...m.drafts, ...m.queue].map(t => [String(t.id), t.linked]));
  lightUp();
  const flying = m.queue.filter(t => t.inFlight).length;
  $('queue-n').textContent = `${flying} in flight · ${m.queue.length - flying} queued`;

  // The shipped time turns from the time alone to date and time after midnight, so it is put right on a kept row.
  fill('shipped', keptItems('shipped', m.shipped, t => String(t.id), () => null, t => {
    const bits = [t.minutes !== null ? `${t.minutes} min` : null, plural(t.roundCount, 'round'), `${t.tokens.toLocaleString('en-GB')} reviewer tokens`,
      t.builderTokens !== null ? `${t.builderTokens.toLocaleString('en-GB')} builder tokens` : null, t.builderCost !== null ? `${dollars(t.builderCost)} builder cost` : null].filter(Boolean);
    const name = el('td', null, null, el('span', 'id', t.id), typeTag(t), document.createTextNode('\u00a0 '), fullLink(t));
    return el('tr', null, null, name, el('td', 'num', bits.join(' · ')), el('td', 'num', t.when), el('td', 'full-cell', null, packButton(t)));
  }, { own: t => { const { when, ...own } = t; return own; }, derived: t => t.when, update: (tr, t) => setText(tr.children[2], t.when) }), 'Nothing shipped yet.');
  const stat = (value, label, s) => el('div', 'stat', null, el('b', null, value),
    el('span', null, s ? `${label} · ${plural(s.count, 'ticket')}` : label));
  const med = (s, fmt = String) => (s.median === null ? '–' : fmt(s.median));
  $('shipped-stats').hidden = m.shippedTotal === 0;
  $('shipped-stats').replaceChildren(...(m.shippedTotal ? [stat(m.stats.today, 'shipped today'),
    stat(med(m.stats.minutes), 'median minutes', m.stats.minutes), stat(med(m.stats.rounds), 'median review rounds', m.stats.rounds),
    stat(med(m.stats.tokens, n => n.toLocaleString('en-GB')), 'median reviewer tokens', m.stats.tokens),
    stat(med(m.stats.builderTokens, n => n.toLocaleString('en-GB')), 'median builder tokens', m.stats.builderTokens),
    stat(med(m.stats.builderCost, dollars), 'median builder cost', m.stats.builderCost)] : []));
  $('shipped-n').textContent = `${m.shippedTotal} in total`;

  const status = el('div', connected ? 'pill' : 'pill off', null, el('span', connected ? 'live' : 'live off'),
    document.createTextNode(connected ? `live · ${lastOk ? Math.max(0, Math.round((Date.now() - lastOk) / 1000)) : 0}s ago` : 'disconnected'));
  $('pills').replaceChildren(status);
  // Whether speck run is on: when it's off, setting a ticket ready starts nothing.
  const on = !!(state.run && state.run.on);
  $('run').replaceChildren(el('div', on ? 'pill run-on' : 'pill run-off', null, el('span', on ? 'live' : 'live idle'), document.createTextNode(on ? 'speck run on' : 'speck run off')));
  const sw = el('button', null, runSwitching ? (runSwitching === 'on' ? 'Turning on…' : 'Turning off…') : on ? 'Turn off' : 'Turn on');
  sw.type = 'button';
  sw.disabled = !!runSwitching;
  sw.title = on ? 'Stop speck run as Ctrl+C does: builds already running carry on' : 'Start speck run, which starts a build for each ready ticket';
  sw.addEventListener('click', e => { e.stopPropagation(); if (!sw.disabled) switchRun(on ? 'off' : 'on'); });
  $('run-switch').replaceChildren(sw);
}
// 0128: the speck run switch. The server starts or stops speck run and answers once it's on or off, so the pill shows
// that at once. A refusal shows speck run's own message under the header until the next click on the switch.
async function switchRun(to) {
  if (runSwitching) return;
  runSwitching = to;
  showRunError(null);
  render();
  try {
    const res = await fetch(`/api/run/${to}`, { method: 'POST', headers: { 'X-Speck-Token': TOKEN } });
    let body = null;
    try { body = await res.json(); } catch { /* no JSON: say what we know */ }
    if (res.ok && body && body.run) {
      if (body.run.on) state.run = body.run;
      else delete state.run;
    } else showRunError(body && typeof body.error === 'string' && body.error ? body.error : `The server refused (${res.status}).`);
  } catch {
    showRunError(`Couldn't reach the panel server, so speck run wasn't turned ${to}.`);
  }
  runSwitching = null;
  render();
}
function showRunError(text) {
  $('run-error').hidden = !text;
  $('run-error').textContent = text || '';
}
function setConnected(ok, problem) {
  connected = ok;
  $('offline').hidden = ok;
  if (!ok) $('offline').textContent = problem
    ? `speck panel couldn't read the tickets: ${problem} Showing the last state received. Retrying every 2 seconds…`
    : "Disconnected: can't reach speck panel. Showing the last state received. Retrying every 2 seconds…";
  if (state) render();
  else $('pills').replaceChildren(el('div', ok ? 'pill' : 'pill off', null, el('span', ok ? 'live' : 'live off'), document.createTextNode(ok ? 'live' : 'disconnected')));
}

// speck panel restarts by itself when its code changes. When the new code fails to start, the old server keeps serving
// and says so in restart_error, until a later change starts.
function showRestartError(line) {
  $('restart').hidden = !line;
  $('restart').textContent = line ? `speck panel couldn't restart with its changed code: ${line} It's still running the code it had, and tries again on the next change.` : '';
}

// Fetches the state every 2 seconds without reloading the page. Each poll schedules the next one before it starts, so
// a request that never finishes can't stop polling. A request still pending when the next one is due counts as
// disconnected and is aborted, and only the latest request's answer is used. A failure shows as disconnected and
// polling carries on, so the page recovers by itself when the server is back.
let seq = 0, pending = null;
async function poll() {
  setTimeout(poll, POLL_MS);
  if (pending) { pending.abort(); pending = null; setConnected(false); }
  const mine = ++seq, ctl = new AbortController();
  pending = ctl;
  try {
    const res = await fetch('/api/state', { cache: 'no-store', signal: ctl.signal });
    let body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (mine !== seq) return; // a newer request has taken over
    if (!res.ok || !body || !Array.isArray(body.tickets)) setConnected(false, (body && body.error) || `the server answered ${res.status}.`);
    else { state = body; lastOk = Date.now(); showRestartError(body.restart_error); setConnected(true); }
  } catch (e) {
    if (mine === seq) setConnected(false);
  } finally {
    if (pending === ctl) pending = null;
  }
}
poll();
</script>
