<title>speck · control panel</title>
<script id="theme-start">
// 0136: set the look before the page is first drawn: the one last chosen in this browser (in Settings since 0372), or
// else the computer's light or dark setting, followed as it changes until a choice is made.
(() => {
  const root = document.documentElement;
  const saved = () => { try { const t = localStorage.getItem('speck-theme'); return t === 'light' || t === 'dark' ? t : null; } catch { return null; } };
  const system = matchMedia('(prefers-color-scheme: dark)');
  // 0160: the home-screen app's status bar: black-translucent (light text) on the dark look, default (dark text) on the
  // light one. iOS reads it as the app opens.
  const bar = look => { const m = document.getElementById?.('status-bar'); if (m) m.content = look === 'dark' ? 'black-translucent' : 'default'; };
  // 0372: Settings' look, while it's open, shows the one the page has (0396: drawn by the page's drawLook).
  const set = look => { root.dataset.theme = look; bar(look); if (typeof globalThis.drawLook === 'function') globalThis.drawLook(); };
  // 0412: System, Light or Dark: the one picked in this page, or else the one kept in this browser, or else System,
  // which follows the computer's setting.
  let picked = null;
  const choice = () => picked || saved() || 'system';
  set(choice() === 'system' ? (system.matches ? 'dark' : 'light') : choice());
  system.addEventListener('change', e => { if (choice() === 'system') set(e.matches ? 'dark' : 'light'); });
  globalThis.setLook = set; // for Settings' look
  globalThis.lookChoice = choice;
  globalThis.pickLook = c => {
    if (c !== 'system' && c !== 'light' && c !== 'dark') return;
    picked = c;
    set(c === 'system' ? (system.matches ? 'dark' : 'light') : c);
  };
})();
</script>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --raise: #f0eee6; --line: #87847d; --line-soft: #e8e7e3;
    --text: #141413; --muted: #3d3d3a; --faint: #4d4c48;
    --accent: #853123; --ok: #3f522e; --warn: #67460b; --bad: #921f2d; --run: #304f6d; --idea: #623f6c;
    /* 0302: the LCD screen, from the design (docs/design/lcd/), lighter since 0308: speck's screen since 0413 */
    --lcd-bg: #e6e9db; --lcd-off: #dde1cf; --lcd-ink: #20241d; --lcd-red: #d63f28; --lcd-shadow: rgba(30, 40, 15, .14);
    --bezel: #262722; --bezel-ink: #e6e7df; --bezel-muted: #b8b9b1; /* 0413: the screen's dark frame, from the design's console */
    --dot: #b0412e; /* 0303: the speck in the header's mark */
    --inbox: #22544c; /* the inbox's own colour */
    --bug: #7a3553; /* the bug tag's own colour */
    --fix: #584c0e; /* the fix tag's own colour */
  }
  /* The zen look: a serif for headings and ticket titles, a light sans for body text and a monospace for labels. Each
     names the zen fonts first, used when they're installed, and none is loaded from another host. */
  * { box-sizing: border-box; border-radius: 0 !important; }
  /* 0160: in the home-screen app the page reaches behind the status bar and home indicator (viewport-fit=cover). The
     header pads the status bar, the page pads the home indicator and a phone's rounded corners on its sides, and the full
     ticket starts below the status bar, so nothing it scrolls shows there. While the
     header stays on screen, a ticket scrolled to sits below it (--head is its height, kept by the page script). */
  html { scroll-padding-top: var(--head, 0px); }
  body { padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  body { margin: 0; font: 400 13px/1.5 "Zen Kaku Gothic New", "Noto Sans JP", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  b, strong { font-weight: 600; }
  /* 0161: a clear ring round whatever the keyboard reaches */
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  code, .mono, .id { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  code { font-size: 12px; color: var(--muted); }

  @font-face { font-family: "Doto"; src: url("/fonts/Doto.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
  /* 0413: the top of the panel is speck's screen in its dark frame, as the design's console (without its keys or the text
     under the screen). The frame's title row has speck's name in the dot-matrix lettering, the project and base branch
     cut short with "…", and Settings at its right end. The screen under it shows the Foreman's word and speck. */
  header { position: sticky; top: 0; z-index: 8; overflow-anchor: none; padding: calc(8px + env(safe-area-inset-top)) 16px 8px; border-bottom: .5px solid var(--line); background: var(--bg); }
  .bezel { box-sizing: border-box; max-width: 520px; margin: 0 auto; padding: 5px 7px 7px; color: var(--bezel-ink); background: var(--bezel); border: 2px solid var(--bezel); }
  .bezel.needs { border-color: var(--bad); } /* the Foreman's word is "Needs you <n>" */
  .bezel .print { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 0 0 4px 2px; }
  .bezel .name { flex: none; font-family: "Doto", ui-monospace, monospace; font-weight: 900; font-size: 20px; line-height: 1; color: var(--bezel-ink); }
  .bezel .repo { flex: 1 1 auto; min-width: 0; text-align: right; font: 400 12px/1.5 "Zen Kaku Gothic New", "Noto Sans JP", system-ui, sans-serif; color: var(--bezel-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bezel .repo code { font-size: inherit; color: inherit; }
  .bezel .settings-open { flex: none; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: .5px solid var(--bezel-muted); background: transparent; color: var(--bezel-muted); cursor: pointer; }
  .bezel .settings-open:hover { border-color: var(--bezel-ink); color: var(--bezel-ink); }
  .bezel .settings-open svg { width: 15px; height: 15px; }
  .bezel :focus-visible { outline-color: var(--bezel-ink); }
  .bezel .glass { position: relative; display: block; width: 100%; padding: 0; color: var(--lcd-ink); background: var(--lcd-bg); border: .5px solid var(--bezel-muted); cursor: pointer; }
  .bezel .glass::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .3); pointer-events: none; }
  .bezel .glass canvas { display: block; width: 100%; height: auto; aspect-ratio: 160 / 72; image-rendering: pixelated; }

  /* 0410: the page is the height of the screen and never scrolls. Under the header, Plan, Build and Shipped are tabs,
     one lane open at a time, and only the open lane's list scrolls. 0418: one column at every width, 720 px wide and
     centred on a wider window, with no border round a lane: its tickets sit directly under the tabs. */
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header, .offline, .restart, .run-error, .tabs { flex: none; }
  header, .offline, .restart, .run-error, .tabs, main { box-sizing: border-box; width: 100%; max-width: 720px; margin-left: auto; margin-right: auto; }
  /* 0425: the three tabs share the row equally, each its name on one line (and Build's needs-you number) */
  .tabs { display: flex; padding: 8px 16px 0; border-bottom: .5px solid var(--line); background: var(--bg); }
  .tab { flex: 1 1 0; display: flex; align-items: baseline; justify-content: flex-start; column-gap: 6px; min-width: 0; margin-bottom: -.5px; padding: 6px 8px; font: inherit; color: var(--muted); background: transparent; border: .5px solid transparent; border-bottom-color: var(--line); cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); }
  .tab .tab-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .tab .needs { flex: none; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  .tab .needs { color: var(--bad); }
  .tab .needs:empty { display: none; }
  main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 0 0 env(safe-area-inset-bottom); }
  section { background: var(--panel); border: .5px solid var(--line); }
  main > section { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border: 0; }
  main > section[hidden] { display: none; }
  /* 0425: Build's and Shipped's counts, the first line of their lane */
  .lane-n { flex: none; padding: 6px 16px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); border-bottom: .5px solid var(--line-soft); }
  .lane-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .sh { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: .5px solid var(--line); }
  .sh h2 { margin: 0; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .sh .n { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); font-size: 12px; }
  .group { padding: 7px 14px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); border-bottom: .5px solid var(--line-soft); background: var(--raise); }
  .group.attn { color: var(--warn); }
  .group.run { color: var(--run); }

  .id { font-size: 12px; color: var(--muted); }
  .tag { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; padding: 0 8px; border: .5px solid var(--line); color: var(--muted); white-space: nowrap; line-height: 27px; display: inline-block; }
  .tag.p1 { color: var(--text); border-color: var(--text); }
  .tag.p0 { color: var(--bad); border-color: var(--bad); } /* 0213: a fix ticket's P0 stands out more than a P1 */
  .tag.high { color: var(--bad); border-color: var(--bad); }
  .tag.bug { color: var(--bug); border-color: var(--bug); }
  .tag.fix { color: var(--fix); border-color: var(--fix); }
  .tag.document { color: var(--idea); border-color: var(--idea); }
  .prio { position: relative; display: inline-block; }
  .tag.pick { cursor: pointer; }
  .tag.pick:hover { color: var(--text); border-color: var(--muted); }
  .tag.p0.pick:hover { color: var(--bad); border-color: var(--bad); } /* 0213: P0 stays red on hover */
  /* 0165: a tag's tip, which says what it means, next to the tag */
  #tag-tip { position: fixed; top: 0; left: 0; z-index: 11; max-width: min(300px, calc(100vw - 16px)); padding: 6px 10px; font-size: 14px; line-height: 1.4; color: var(--text); background: var(--panel); border: .5px solid var(--line); box-shadow: 0 4px 12px rgba(20, 20, 19, .12); }
  #tag-tip[hidden] { display: none; }
  .tag[role="button"]:not(.pick) { cursor: help; }
  .prio-menu { position: absolute; top: calc(100% + 2px); left: 0; z-index: 5; display: flex; background: var(--panel); border: .5px solid var(--line); }
  .prio-menu button { font: inherit; font-size: 14px; padding: 1px 8px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
  .prio-menu button:hover { color: var(--text); }
  .prio-menu button.on { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .item .prio-refused { margin-top: 6px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 14px; color: var(--text); }
  .sub { font-size: 12px; color: var(--muted); }
  .tick { display: inline-block; width: 4px; height: 8px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin: 0 6px 2px 2px; }
  .sq { display: inline-block; width: 6px; height: 6px; background: currentColor; margin: 0 6px 1px 1px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .run { color: var(--run); }

  /* Shaping */
  /* 0151: each item is a card of its own, with space between cards */
  #shaping { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; }
  #shaping .empty { padding: 0 4px; }
  .item { padding: 10px 14px; border: 1px solid var(--line); }
  .head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; cursor: pointer; }
  .item .head { margin: -10px -14px; padding: 10px 14px; } /* the item's padding opens and closes it too */
  .item .checks { grid-column: 1 / 2; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
  .item.open { background: var(--raise); border-color: var(--text); }
  .detail { margin-top: 10px; border-top: .5px solid var(--line-soft); padding-top: 8px; display: grid; grid-template-columns: 1fr 220px; gap: 16px; }
  .detail h4 { margin: 0 0 4px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 400; }
  .detail p { margin: 0 0 8px; color: var(--text); }
  .detail ol { margin: 0; padding-left: 18px; color: var(--text); }
  .detail ol li { margin-bottom: 4px; }
  .ready { border-left: .5px solid var(--line-soft); padding-left: 14px; font-size: 12px; }
  .ready div { padding: 3px 0; }
  .set-ready { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-top: 10px; padding: 4px 12px; background: var(--text); color: var(--panel); border: .5px solid var(--text); cursor: pointer; }
  .set-ready:disabled { background: transparent; color: var(--faint); border-color: var(--line); cursor: not-allowed; }
  .ready div.refused { white-space: pre-wrap; }
  /* 0151: a ticket's id and title on one line, a wrapped title's next line starting under the title, then its tags.
     0214: an idea's or inbox note's label and title too */
  .item .line { display: flex; align-items: baseline; gap: 8px; }
  .item .line .id { flex: none; font-size: 14px; }
  .item .line .title { flex: 1 1 auto; min-width: 0; font-size: 17px; }

  /* Queue */
  /* 0155: each ticket is a card of its own, laid out as a Plan ticket. 0167: only a ticket waiting for you or in trouble
     is coloured, by its border and background (below the highlights, so they win) */
  #queue { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; }
  #queue .empty { padding: 0 4px; }
  .q { padding: 10px 14px; border: 1px solid var(--line); }
  .q .top { cursor: pointer; }
  .q .top .line { display: flex; align-items: baseline; gap: 8px; }
  .q .top .line .id { flex: none; font-size: 14px; }
  .q .top .line .title { flex: 1 1 auto; min-width: 0; font-size: 17px; }
  .q .top .sub { font-variant-numeric: tabular-nums; }
  .q .log { margin: 6px 0 4px; padding: 6px 10px; height: 24em; max-height: 24em; overflow-y: auto; background: var(--bg); border-left: 2px solid var(--line-soft);
    font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
  /* 0422: one line of the log a row, its text past a column for the time, so a line that wraps, or a message's next line,
     starts under the text. Each kind of entry has its own colour; anything else keeps the log's muted one */
  .q .log { overflow-anchor: none; } /* 0422: rows taken out at the top leave the box's scroll place as it was, as text did */
  .q .log .ln { display: block; padding-left: 9ch; }
  .q .log .ln.timed { text-indent: -9ch; }
  .q .log .ln.plain { padding-left: 0; }
  .q .log .at { color: var(--muted); }
  .q .log .msg { color: var(--text); }
  .q .log .tool { color: var(--run); }
  .q .log .fail { color: var(--bad); }
  .q .log .note { color: var(--warn); }
  .q.wait { background: var(--raise); } /* 0161: set back by its fill, not faded, so its text keeps its contrast */
  /* An open running or paused build's Stop build button, beside Full ticket, and why the server refused it */
  /* 0421: an open card's Full ticket, Review pack and Stop build are small text buttons on one line, underlined rather than boxed */
  .q .stop-build { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; line-height: 16px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 2px; padding: 2px 0; background: transparent; color: var(--muted); border: 0; border-bottom: .5px solid var(--line); cursor: pointer; }
  .q .stop-build:hover { color: var(--bad); border-color: var(--bad); }
  .q .stop-build:disabled { cursor: default; opacity: .6; }
  /* An open ready ticket's Back to Plan button, beside Full ticket, and why the server refused it */
  .q .back-to-plan { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 2px 8px; padding: 1px 10px; background: transparent; color: var(--muted); border: .5px solid var(--line); cursor: pointer; }
  .q .back-to-plan:hover { color: var(--text); border-color: var(--text); }
  .q .back-to-plan:disabled { cursor: default; opacity: .6; }
  .q .stop-refused, .q .plan-refused { margin: 4px 0 0; font-size: 12px; color: var(--bad); white-space: pre-wrap; }
  .question { margin: 6px 0 4px; padding: 6px 10px; border-left: 2px solid var(--bad); background: var(--bad-bg); color: var(--text); }
  /* 0283: under a blocked question, whether it changes what you'd notice and whether the recommendation is a clear one */
  .question-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; white-space: normal; }
  .question-fact { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; padding: 0 8px; border: .5px solid var(--line); color: var(--muted); }
  /* 0284: on a blocked question with a recommendation, the button that takes it and has speck run carry the build on */
  .q .go-with { display: block; font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 0; padding: 1px 10px; background: transparent; color: var(--text); border: .5px solid var(--line); cursor: pointer; white-space: normal; }
  .q .go-with:hover { border-color: var(--text); }
  .q .go-with:disabled { cursor: default; opacity: .6; }
  .q .go-with-refused { margin: 4px 0 0; font-size: 12px; color: var(--bad); white-space: pre-wrap; }
  .act { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .act b { color: var(--text); font-weight: 400; }
  .act.to-ship { color: var(--idea); }
  /* 0168: an in-flight ticket's progress, under its title: a sentence saying what's happening and the current stage's
     name, then the timer. 0416: in words only, with no builder badge. */
  .q .top .say { color: var(--text); }
  .q .top .ship-at { color: var(--text); font-variant-numeric: tabular-nums; }
  .q .top .say.bad { color: var(--bad); }
  .q .top .say.to-ship { color: var(--idea); }
  .q .top .stage { color: var(--run); }
  .q .top .stage.bad { color: var(--bad); }
  .q .top .stage.to-ship { color: var(--idea); }
  /* 0419: a Plan or Build ticket is its title line and one details line, in smaller type, its parts separated by " · ".
     Each part stays whole, so the line wraps between parts, and only when it doesn't fit; a list of linked ids too
     long for a line wraps between its ids. */
  .item.ticket, .q { padding: 6px 10px; }
  .item.ticket .head { display: block; margin: -6px -10px; padding: 6px 10px; }
  .item.ticket .line .title, .q .top .line .title { line-height: 20px; }
  .item.ticket .line .id, .q .top .line .id { line-height: 14px; } /* inside the title's line, which it then doesn't make taller */
  .item.ticket .head .checks, .q .top .progress, .q .top .act { display: block; font-family: inherit; font-size: 12px; line-height: 14px; color: var(--muted); }
  .item.ticket .head .checks > :not(.ids), .q .top .progress > :not(.ids), .q .top .act > :not(.ids) { white-space: nowrap; }
  .item.ticket .head .checks .tag, .q .top .progress .tag, .q .top .act .tag { display: inline; font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; padding: 0; border: 0; line-height: inherit; vertical-align: baseline; } /* inline, as a box beside a dot would let the line break before the dot */
  /* the spaces either side of a dot a little narrower than a whole character, so a line such as "Writing tests and code
     · Build · 19:18 · P3 · M · low" fits a 420 px pane */
  .item.ticket .head .checks .sep, .q .top .progress .sep, .q .top .act .sep { letter-spacing: -3px; }
  @media (prefers-reduced-motion: no-preference) {
    /* 0154: a ticket gone to from a linked id lights up, then fades back by itself */
    .item.flash, .q.flash { animation: flash 1.5s ease-out; }
    @keyframes flash { 0%, 40% { box-shadow: inset 0 0 0 2px var(--text); } } /* 0167: a ring only, so a state's tint stays */
  }
  .question.exit.to-ship { border-left-color: var(--idea); }
  .question.exit.carried { border-left-color: var(--run); background: var(--raise); } /* 0338: speck run is carrying it on */
  .question.exit { border-left-color: var(--bad); max-height: 16em; overflow-y: auto; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  .resume { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; }
  .resume .cmd { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); background: var(--raise); padding: 3px 8px; user-select: all; overflow-wrap: anywhere; }
  .resume .copy { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: none; border: .5px solid var(--line); padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  .resume .copy:hover { color: var(--text); }
  /* 0418: in the lanes, the narrow layout at every width: a Plan item's readiness under its details, and a resume command
     that wraps. Elsewhere these keep their own layout. */
  main .sh { flex-wrap: wrap; align-items: center; }
  main .detail { grid-template-columns: minmax(0, 1fr); }
  main .ready { border-left: 0; padding-left: 0; border-top: .5px solid var(--line-soft); padding-top: 8px; }
  main .resume { flex-wrap: wrap; }
  main .resume .cmd { min-width: 0; }
  .q .tag.high { color: var(--bad); border-color: var(--bad); }
  .next { color: var(--ok); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; border: .5px solid var(--ok); padding: 0 5px; }

  /* Shipped */
  /* 0157: the stats a grid of tiles of equal size, each number over its label and the tickets its median covers, and
     each shipped ticket a card of its own, laid out as a Plan ticket */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: .5px; background: var(--line); border-bottom: .5px solid var(--line-soft); }
  .stat { display: flex; flex-direction: column; min-width: 0; padding: 8px 6px; background: var(--panel); }
  .stat .num { font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.3; }
  .stat .label { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .stat .count { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--faint); }
  .stats[hidden] { display: none; }
  /* 0420: the three stats one line of smaller type, with More stats at its end; the other three still tiles under it.
     Each stat stays whole, so in a pane too narrow for the line, such as a phone's, it wraps between them. */
  .stats-line { display: flex; align-items: flex-end; gap: 8px; padding: 6px 16px; border-bottom: .5px solid var(--line-soft); }
  .stats-line[hidden] { display: none; }
  #shipped-stats { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
  #shipped-stats .part { white-space: nowrap; }
  #shipped-stats .num { font-weight: 600; color: var(--text); }
  #shipped-stats .sep { letter-spacing: -3px; }
  #shipped-stats[hidden] { display: none; }
  .full-open.more-stats, #shipped .details { flex: none; margin: 0; padding: 0 5px; font-family: inherit; line-height: 16px; text-transform: none; letter-spacing: 0; }
  .more-stats[hidden] { display: none; }
  /* 0420: a shipped ticket is its title line, with any bug or fix tag after the title, and one line of smaller type:
     when it shipped and its figures, separated by " · ", with a small Details button at its end. Details and More
     stats are plain words in a thin box, so these lines fit on one line in a 420 px pane with a scroll bar. */
  #shipped .sum { display: flex; align-items: flex-end; gap: 6px; margin-top: 2px; }
  #shipped .meta { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
  #shipped .meta > * { white-space: nowrap; } /* whole, so a line too long for a phone wraps between its time and figures */
  #shipped .meta .sep { letter-spacing: -3px; }
  #shipped .details { margin-left: auto; }
  section.shipped table { display: block; }
  #shipped { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; }
  #shipped .empty { padding: 0 4px; }
  #shipped tr { display: block; padding: 6px 8px; border: 1px solid var(--line); }
  #shipped td { display: block; padding: 0; border: 0; }
  #shipped .line { display: flex; align-items: baseline; gap: 8px; }
  #shipped .line .id { flex: none; font-size: 14px; line-height: 14px; }
  #shipped .line .title-link { flex: 0 1 auto; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 17px; line-height: 22px; overflow-wrap: anywhere; }
  /* the tag a small box in the title's line, as tall as the details line, so it doesn't make the card taller */
  #shipped .line .tags { flex: none; display: inline-flex; gap: 6px; font-size: 12px; }
  #shipped .line .tags .tag { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; line-height: 16px; padding: 0 5px; }
  /* 0204: a ticket merged but not pushed, in crimson, with speck ship's message */
  #shipped td.unpushed { margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--bad); }
  #shipped .unpushed-head { color: var(--bad); font-weight: 600; }
  #shipped .unpushed-said { margin-top: 2px; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  #shipped .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 16px; margin-top: 8px; }
  #shipped .fig .k { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #shipped .fig .v { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  #shipped .full-cell { margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 14px; border-bottom: .5px solid var(--line-soft); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { color: var(--muted); text-align: right; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; white-space: nowrap; }

  /* Live panel additions */
  /* 0285: the Foreman's detail, in a pop-up over the whole panel (0366) */
  .foreman { font-size: 13px; overflow-anchor: none; } /* 0415: the page keeps a reader's place in the log itself */
  .foreman h3 { margin: 14px 0 4px; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 14px; font-weight: 600; color: var(--text); }
  .foreman .fm-now > h3:first-child { margin-top: 4px; }
  .foreman ol.run-log { margin: 0; padding: 0; list-style: none; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  .foreman ol.run-log li { padding: 1px 0; border-bottom: .5px solid var(--line-soft); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .foreman h4 { margin: 8px 0 2px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .foreman ul { margin: 0; padding-left: 18px; }
  .foreman p { margin: 2px 0; }
  .foreman .stale, .foreman .held { color: var(--warn); }
  /* 0318: the Foreman's question, with an Answer box and Answer and Dismiss buttons, on its ticket's card and in its detail */
  .foreman-ask { margin: 6px 0 6px; white-space: normal; }
  .foreman-ask .ask-answer { display: block; box-sizing: border-box; width: 100%; min-height: 3em; margin: 4px 0 0; padding: 4px 6px; font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: .5px solid var(--line); resize: vertical; }
  .foreman-ask .ask-buttons { display: flex; gap: 8px; margin: 6px 0 0; }
  .foreman-ask .ask-reply { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 10px; background: transparent; color: var(--text); border: .5px solid var(--line); cursor: pointer; }
  .foreman-ask .ask-reply:hover { border-color: var(--text); }
  .foreman-ask .ask-reply:disabled { cursor: default; opacity: .6; }
  .foreman-ask .ask-refused { margin: 4px 0 0; font-size: 12px; color: var(--bad); white-space: pre-wrap; }
  .foreman .reload { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); background: var(--panel); border: .5px solid var(--line); padding: 2px 10px; cursor: pointer; }
  /* 0396: Appearance's and Auto-build's switches: a track whose knob slides right when it's on, and its state beside it */
  #settings [role="switch"] { display: inline-flex; align-items: center; gap: 8px; min-height: 26px; padding: 0; font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); background: none; border: 0; cursor: pointer; }
  #settings [role="switch"]:disabled { cursor: default; opacity: .6; }
  #settings [role="switch"] .track { position: relative; flex: none; box-sizing: border-box; width: 34px; height: 18px; border: 1px solid var(--line); border-radius: 9px; background: var(--raise); }
  #settings [role="switch"] .knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; color: var(--panel); background: var(--muted); transition: left .15s; }
  #settings [role="switch"][aria-checked="true"] .track { border-color: var(--text); color: var(--panel); background: var(--text); }
  #settings [role="switch"][aria-checked="true"] .knob { left: 18px; background: var(--panel); }
  #settings [role="switch"]:hover .track { border-color: var(--text); }
  #settings [role="switch"] .state { white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { #settings [role="switch"] .knob { transition: none; } }
  /* 0412: Appearance's System, Light and Dark, side by side in one box, the chosen one filled */
  #settings .looks { display: inline-flex; flex: none; border: .5px solid var(--line); }
  #settings .looks [role="radio"] { min-height: 26px; padding: 0 6px; font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; white-space: nowrap; }
  #settings .looks [role="radio"] + [role="radio"] { border-left: .5px solid var(--line); }
  #settings .looks [role="radio"]:hover { color: var(--text); }
  #settings .looks [role="radio"][aria-checked="true"] { color: var(--panel); background: var(--text); }
  @media (max-resolution: 1.99dppx), (-webkit-max-device-pixel-ratio: 1.99) { #settings .looks, #settings .looks [role="radio"] + [role="radio"] { border-width: 1px; } }
  #settings .switch-row p.bad { margin: 4px 0 0; color: var(--bad); white-space: pre-wrap; overflow-wrap: anywhere; }
  #settings .switch-row p.bad[hidden] { display: none; }
  .run-error { font-size: 12px; color: var(--bad); padding: 6px 16px; border-bottom: .5px solid var(--line); background: var(--bad-bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .run-error[hidden] { display: none; }
  .offline { font-size: 12px; color: var(--bad); padding: 6px 16px; border-bottom: .5px solid var(--line); background: var(--bad-bg); }
  .offline[hidden] { display: none; }
  .restart { font-size: 12px; color: var(--warn); padding: 6px 16px; border-bottom: .5px solid var(--line); background: var(--raise); }
  .restart[hidden] { display: none; }
  .question, .title { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ready div { overflow-wrap: anywhere; }

  /* Shaping: tickets, ideas and the inbox, one list at a time. The selected tab has a border in the text colour (0167). */
  .toggles { display: flex; }
  .toggle { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; padding: 1px 10px; background: transparent; border: .5px solid var(--line); margin-left: -.5px; color: var(--muted); cursor: pointer; }
  .toggle.on { color: var(--text); border-color: var(--text); position: relative; z-index: 1; }
  /* 0164: only where the main pointer can hover, as a phone keeps a tapped card's :hover until the next tap */
  @media (hover: hover) { .item:hover { background: var(--raise); } }
  /* The light tints. 0167: the open item in Shaping or the queue is set apart by a raised fill and a border in the text
     colour; only a ticket waiting for you or in trouble keeps a tint (below). */
  :root { --accent-bg: #f7ebe6; --idea-bg: #f2ecf3; --inbox-bg: #e9f2f0; --bad-bg: #fae6e8; }
  .q.open { background: var(--raise); border-color: var(--text); }
  .note { margin: 0; color: var(--text); }
  .empty { padding: 10px 14px; color: var(--faint); font-size: 12px; }

  /* Chains through after:: a chain icon on a ticket that unlocks others, a padlock on one that waits */
  .chain, .lock { display: inline-block; position: relative; width: 12px; height: 10px; vertical-align: -1px; cursor: help; }
  .chain { color: var(--muted); transform: rotate(-35deg); }
  .chain::before, .chain::after { content: ''; position: absolute; top: 3px; width: 6px; height: 4px; border: 1.5px solid currentColor; }
  .chain::before { left: 0; } .chain::after { left: 4px; }
  .lock { color: var(--faint); }
  .lock::before { content: ''; position: absolute; left: 3px; top: 0; width: 6px; height: 5px; border: 1.5px solid currentColor; border-bottom: 0; }
  .lock::after { content: ''; position: absolute; left: 2px; top: 4px; width: 8px; height: 6px; background: currentColor; }
  /* 0185: a hovered ticket and those linked to it get a ring in the text colour inside their border, and keep their fill and
     text colours. The rest are left exactly as they are, rather than set back with the hover's own fill. */
  .item.hl, .q.hl { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  /* 0167: a ticket in trouble, blocked or its build stopped, is crimson; one waiting for you to ship it is purple, as
     nothing is wrong (0138). Each keeps its border and background whether it's open or highlighted. */
  .q.blocked { border-color: var(--bad); background: var(--bad-bg); }
  .q.to-ship { border-color: var(--idea); background: var(--idea-bg); }
  /* 0171: a ticket an agent is at work on has a 2px border in its stage's colour, and its fill stays as it is, as only a
     ticket that needs you is filled. It keeps it whether it's open or highlighted. */
  .q.at-build { border-color: var(--run); border-width: 2px; }
  .q.at-check { border-color: var(--inbox); border-width: 2px; }
  .q.at-review { border-color: var(--warn); border-width: 2px; }
  .q.at-ship { border-color: var(--ok); border-width: 2px; }
  /* 0154: a linked ticket's id in a "waiting on" or "unlocks" note, which goes to that ticket and lights it briefly */
  .goto { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .goto:hover { text-decoration-style: solid; }
  /* It fades out over its 1.5 seconds (in the block for motion above), or stays still until they're up when the browser asks for reduced motion */
  @media (prefers-reduced-motion: reduce) { .item.flash, .q.flash { box-shadow: inset 0 0 0 2px var(--text); } }

  /* The full ticket, over the whole panel (0423). While it's open, the page behind it holds still, under a backdrop. */
  html.held { overflow: hidden; }
  #full-backdrop { position: fixed; inset: 0; z-index: 9; background: rgba(20, 20, 19, .2); touch-action: pinch-zoom; }
  #full-backdrop[hidden] { display: none; }
  .full-open { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 10px 0 0 8px; padding: 4px 12px; background: transparent; color: var(--muted); border: .5px solid var(--line); cursor: pointer; }
  .full-open:hover { color: var(--text); }
  .q .full-open { margin: 6px 16px 2px 0; padding: 2px 0; font-size: 12px; line-height: 16px; border: 0; border-bottom: .5px solid var(--line); }
  .q .full-open:hover { border-color: var(--text); }
  td.full-cell { width: 1%; padding-left: 0; }
  td .title-link { color: var(--text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; }
  td .title-link:hover { text-decoration-thickness: 2px; }
  td .full-open { margin: 0; padding: 0 8px; font-size: 12px; white-space: nowrap; }
  /* 0423: over the whole panel, as Settings is (0368), its text in a centred column at most 720 px wide. The room beside
     the column is padding, so the Ship button and the rest line up with the text. The left side's is rounded down to a
     whole pixel (0281), and the right side's up, so the column is never wider than 720 px. */
  #full-ticket { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; z-index: 10; background: var(--panel); padding: 0 max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); padding-left: max(16px, env(safe-area-inset-left), round(down, calc((100% - 720px) / 2), 1px)); padding-right: max(16px, env(safe-area-inset-right), round(up, calc((100% - 720px) / 2), 1px)); }
  #full-ticket[hidden] { display: none; }
  /* 0257: the Settings view, a side pane like the full ticket's, over its own backdrop */
  #settings-backdrop { position: fixed; inset: 0; z-index: 9; background: rgba(20, 20, 19, .2); touch-action: pinch-zoom; }
  #settings-backdrop[hidden], #settings[hidden] { display: none; }
  /* 0368: a pop-up over the whole panel, as a document's is (0362), its settings in a centred column. Beside the column
     is its backdrop. Above the ticket pane, and below the question about unsaved changes. The column's left edge is
     rounded down to a whole pixel, so its controls stay on whole pixels (0281) whatever room the scroll bar takes.
     0385: it scrolls only up and down. A finger can't pan it sideways, and each of its children clips anything wider
     than the column, 16 px beyond it so focus rings and shadows still show: that stays inside the pop-up's padding, so
     there's nothing beside the column to scroll to, even from script. */
  #settings { position: fixed; inset: 0; z-index: 10; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y pinch-zoom; background: var(--panel); padding: 0 max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #settings > * { max-width: 760px; overflow-x: clip; overflow-clip-margin: 16px; margin-left: auto; margin-right: auto; margin-left: max(0px, round(down, calc((100% - 760px) / 2), 1px)); }
  #settings .top h3 { margin: 0; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 18px; font-weight: 600; }
  /* 0273: each group a box with a heading bar, like the panel's sections, with space between them. Each setting is a
     row, its name and info button on the left and its value or control on the right: every row splits its width the
     same way, so a group's controls line up in one column. */
  /* 0281: the box's line drawn just outside it as a shadow, taking no room, so what's in the box starts on a whole
     pixel. A half-pixel border shifted it half a pixel, and a phone could then drop a control's left border. (Not an
     outline: only the keyboard's focus ring sets one, 0161.) */
  #settings .sgroup, #settings .switches { margin-top: 16px; border: 0; box-shadow: 0 0 0 .5px var(--line); } /* 0396: the switches' box has no heading */
  #settings .sgroup .sh { padding: 8px 12px; }
  #settings .sgroup h4 { margin: 0; font-family: "Shippori Mincho", "Noto Serif JP", Georgia, serif; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  #settings .switch-row, #settings .setting { position: relative; padding: 8px 12px; border-bottom: .5px solid var(--line-soft); } /* 0371: relative, for its explanation */
  #settings .arow { position: relative; padding: 8px 12px; border-bottom: .5px solid var(--line-soft); } /* 0399: a row of Your agents, as a setting's */
  #settings .switch-row:last-child, #settings .setting:last-child, #settings .arow:last-child { border-bottom: 0; }
  /* 0281: the left half a whole number of pixels wide, so the info buttons and controls each side of the gap start on a
     whole pixel when the row's width is odd. Without round(), two equal halves as before. */
  #settings .switch-row .row, #settings .setting .row, #settings .arow .row { --gap: 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-columns: round(down, calc((100% - var(--gap)) / 2), 1px) minmax(0, 1fr); align-items: center; gap: var(--gap); }
  /* 0277: the name, then the info button at the end of the row's left half, so a group's info buttons line up in one
     column, a row's gap clear of the values, whatever the name's length */
  #settings .switch-row .label, #settings .setting .label, #settings .arow .label { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; min-width: 0; }
  #settings .switch-row .control, #settings .setting .control, #settings .arow .control { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  #settings .setting .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  #settings .setting p.explain .line { margin-top: 6px; } /* 0397: this machine's own value, under the explanation */
  /* 0381: an agent's model, a setting of its own drawn beside the agent's list in its row, its explanation floating from
     the row. Its name is the list's and the info button's label, so only the agent's shows. */
  #settings .setting .setting { position: static; padding: 0; border: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; flex: 1 1 14ch; min-width: 0; max-width: 100%; }
  #settings .setting .setting .pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; max-width: 100%; }
  #settings .setting .setting .list { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; } /* its info button kept beside it */
  #settings .setting .setting .list .info { flex: none; }
  #settings .setting .setting .name { display: none; }
  #settings .setting[hidden], #settings .setting .setting[hidden] { display: none; } /* 0400: an effort for an agent that takes none */
  #settings .setting .setting > p:not(.explain) { flex: 1 1 100%; margin: 0; }
  #settings .switch-row .name, #settings .setting .name, #settings .arow .name { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); } /* 0277: broken only where settingName allows */
  #settings .setting .value { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); background: var(--raise); padding: 0 6px; overflow-wrap: anywhere; }
  #settings .setting p, #settings .arow p { margin: 4px 0 0; color: var(--muted); }
  #settings .setting p.bad, #settings .arow p.bad { color: var(--bad); }
  #settings .arow p.said { color: var(--text); }
  /* 0399: Your agents: each agent's state beside its button, and a provider's key field on a line of its own under it */
  #settings .agent .state { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  #settings .agent .keyline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; min-width: 0; }
  #settings .agent .keyline input.edit { box-sizing: border-box; flex: 1 1 16ch; width: auto; min-width: 0; }
  /* 0401: Add an API provider's form: a label above each field, two to a line where there's room */
  #settings .provider-form .pfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18ch), 1fr)); gap: 6px 12px; margin-top: 6px; }
  #settings .provider-form .pfield { display: grid; gap: 2px; min-width: 0; color: var(--muted); }
  #settings .provider-form .pfield .edit { box-sizing: border-box; width: 100%; }
  #settings .provider-form .keyline { display: flex; justify-content: flex-end; margin-top: 6px; }
  /* 0258: a setting the panel can change: its control and Save button */
  #settings .setting .edit, #settings .arow .edit { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); background: var(--raise); border: .5px solid var(--line); padding: 1px 6px; min-width: 0; max-width: 100%; }
  /* 0281: the boxes a whole number of pixels wide, borders and padding included, so their right edges fall on a whole
     pixel. 0273: the text box in the row's right half. */
  #settings .setting input.edit[type="number"] { box-sizing: border-box; width: calc(8ch + 14px); width: round(up, calc(8ch + 14px), 1px); }

  #settings .setting .risk { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--text); display: inline-flex; align-items: center; gap: 4px; } /* 0259: auto_ship_risk's boxes */
  #settings .setting .save, #settings .arow .save { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: none; border: .5px solid var(--line); padding: 1px 8px; cursor: pointer; }

  #settings > .savebar { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); margin: 16px auto 0; margin-left: max(0px, round(down, calc((100% - 760px) / 2), 1px)); padding: 10px 0 calc(16px + env(safe-area-inset-bottom)); background: var(--panel); border-top: .5px solid var(--line-soft); display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }

  #settings .savebar p.said { flex: 1 1 100%; margin: 0; color: var(--text); }
  #settings .save-all { font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text); background: var(--raise); border: .5px solid var(--text); padding: 4px 14px; cursor: pointer; }

  /* 0281: under 2 device pixels to a CSS pixel, half a pixel is less than a device pixel, which a browser may not draw,

  #settings .switch-row .info:hover, #settings .switch-row .info:focus-visible, #settings .setting .info:hover, #settings .setting .info:focus-visible { color: var(--text); border-color: var(--text); }

  /* The dark look, "the same garden at night", switched to with the button in the header */
  :root[data-theme="dark"] {
    --bg: #181818; --panel: #1f1f1f; --raise: #222222; --line: #737373; --line-soft: #262626;
    --text: #e4e4e4; --muted: #c4c4c4; --faint: #b4b4b4;
    --accent: #e5a495; --ok: #a5bb8e; --warn: #daac5d; --bad: #f39ba5; --run: #97b7d8; --idea: #c3abd1;
    --inbox: #82bfb5; --bug: #e0a2bf; --fix: #c9b65c;
    --accent-bg: #2e2320; --idea-bg: #2a2430; --inbox-bg: #1d2a28; --bad-bg: #341d21;
    --lcd-bg: #0d130f; --lcd-off: #151d17; --lcd-ink: #cfe6c6; --lcd-red: #ff5a3f; --lcd-shadow: transparent;
    --bezel: #080907; --bezel-ink: #e6e7df; --bezel-muted: #b8b9b1;
    --dot: #d4664e;
    color-scheme: dark;
  }
  :root[data-theme="dark"] #full-backdrop { background: rgba(0, 0, 0, .45); }
  :root[data-theme="dark"] #settings-backdrop { background: rgba(0, 0, 0, .45); }
  :root[data-theme="dark"] #settings-unsaved { background: rgba(0, 0, 0, .45); }

  /* 0140: a phone screen. One column, nothing past the right edge and labels kept on one line. Wider screens are
     unchanged. 0417: the 44 px tap areas are in the touch screen rules below, so a narrow pane used with a mouse keeps
     compact controls. 0418: the panel's own layout is the same at every width, so these are for Settings and the full
     ticket only, and for anything outside the lanes that shares a lane's class names. */
  @media (max-width: 699.98px) {
    #settings .switch-row .info::after, #settings .setting .info::after { inset: -6px; } /* 0268: easier to tap. 0277: a 30 by 30 px target, the box as beside the controls */
    #settings .looks [role="radio"] { padding: 0 2px; } /* 0412: System, Light and Dark on one line in the control's half of the row, down to 320 px */
    #settings .switch-row .row, #settings .setting .row, #settings .arow .row { --gap: 8px; } /* 0273: room for the names. 0281: the gap the left half's width allows for */
    .sh { flex-wrap: wrap; align-items: center; }
    .detail { grid-template-columns: minmax(0, 1fr); }
    .ready { border-left: 0; padding-left: 0; border-top: .5px solid var(--line-soft); padding-top: 8px; }
    .resume { flex-wrap: wrap; }
    .resume .cmd { min-width: 0; }

    /* The full ticket and review pack */
    /* 0158: each table row is a block, its heading row hidden (but still copied) and each cell labelled with its heading */
    #full-ticket .md table, .shaping .md table, #full-ticket .md tbody, .shaping .md tbody, #doc-view .md table, #doc-view .md tbody,
    #full-ticket .md tr, .shaping .md tr, #full-ticket .md td, .shaping .md td, #doc-view .md tr, #doc-view .md td { display: block; }
    #full-ticket .md thead, .shaping .md thead, #doc-view .md thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #full-ticket .md tr, .shaping .md tr, #doc-view .md tr { padding: 8px 0; border-bottom: .5px solid var(--line); }
    #full-ticket .md tr:last-child, .shaping .md tr:last-child, #doc-view .md tr:last-child { border-bottom: 0; }
    #full-ticket .md td, .shaping .md td, #doc-view .md td { border: 0; padding: 2px 0; overflow-wrap: normal; overflow-x: auto; } /* a word too long for the line scrolls in its cell, unbroken */
    #full-ticket .md td::before, .shaping .md td::before, #doc-view .md td::before { content: attr(data-label); display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
    /* A review pack's criteria: the number and result on one line, then the criterion, then the labelled evidence */
    #full-ticket .md .ac-table tr, .shaping .md .ac-table tr { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
    #full-ticket .md .ac-table td:nth-child(-n+3)::before, .shaping .md .ac-table td:nth-child(-n+3)::before { display: none; }
    #full-ticket .md .ac-table td:nth-child(1), .shaping .md .ac-table td:nth-child(1) { order: 0; font-weight: 600; }
    #full-ticket .md .ac-table td:nth-child(3), .shaping .md .ac-table td:nth-child(3) { order: 1; }
    #full-ticket .md .ac-table td:nth-child(2), .shaping .md .ac-table td:nth-child(2) { order: 2; flex-basis: 100%; }
    #full-ticket .md .ac-table td:nth-child(n+4), .shaping .md .ac-table td:nth-child(n+4) { order: 3; flex-basis: 100%; }
  }

  /* 0417: a touch screen, at any width: every button and clickable control at least 44 px each way (0140, Apple's
     smallest recommended tap target). A mouse or trackpad keeps the compact sizes, even in a narrow pane. */
  @media (pointer: coarse) {
    .bezel .settings-open { width: 44px; height: 44px; margin: -4px -2px -4px 0; }
    .tab { min-height: 44px; }
    .toggle { min-width: 44px; min-height: 44px; }

    /* Shaping */
    .head { min-height: 44px; }
    /* 0151: the priority tag looks like the others, and its tap area is the 44 px box around it */
    .item.ticket .prio { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
    /* 0162: the tap area reaches 7 px past the tag on each side, into the gaps, so the gaps beside it match the rest */
    .item.ticket .prio { padding: 0 7px; margin: 0 -7px; }
    .tag.pick::after { content: ''; position: absolute; inset: 0; }
    /* 0165: every other tag's tap area is an invisible 44 by 44 px box centred on it, and the gaps between tags are
       wide enough that no two tap areas overlap */
    .tag:not(.pick) { position: relative; }
    .tag:not(.pick)::after { content: ''; position: absolute; inset: min(0px, calc((100% - 44px) / 2)); }
    .tag-row, #full-ticket .top .tags { gap: 18px; }
    .prio-menu button { min-width: 44px; min-height: 44px; }
    .set-ready, .full-open { min-width: 44px; min-height: 44px; }
    /* 0164: each id reads as running text, on the line's baseline with its comma straight after it. Its tap area is
       at least 44 px each way, but its negative margins give back what it reaches past the text, so nothing moves. */
    .goto { display: inline-block; vertical-align: baseline; line-height: 16px; min-height: 44px; padding: 14px 8px; margin: -14px -8px; }
    /* A note on several lines has them closer together than that, so each id's text, and the band of its own line,
       sit above every tap area in the note: a tap there reaches that id, not one on the line above or below. */
    .item .checks, .act { isolation: isolate; }
    .goto > span { position: relative; z-index: 1; }
    .goto > span::before { content: ''; position: absolute; inset: -1px -6px; } /* not into the next id's: a comma and a space away */

    /* 0419: a card's details line is 44 px a line, and wide gaps either side of each " · ", so the tags' and linked
       ids' tap areas in it stay apart */
    .item.ticket .head .checks, .q .top .progress, .q .top .act { line-height: 44px; }
    .item.ticket .head .checks .sep, .q .top .progress .sep, .q .top .act .sep { letter-spacing: 0; padding: 0 12px; }
    .item.ticket .head .checks .tag, .q .top .progress .tag, .q .top .act .tag { display: inline-block; } /* a box, for its tap area */
    /* The priority's 44 px box takes no more room in the line than its two characters do */
    .item.ticket .head .checks .prio { padding: 0; margin: 0 calc(1ch - 22px); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }

    /* Queue: the top row is at least 44 px high */
    .q .top { min-height: 44px; }
    /* 0224: a linked id's tap area reaches past its text, so the tags beside it in the line (0419) are above it: a tap
